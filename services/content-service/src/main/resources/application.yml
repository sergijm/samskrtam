server:
  port: ${CONTENT_SERVICE_PORT}
  shutdown: graceful
  error:
    include-stacktrace: always
    include-exception: true

spring:
  application:
    name: content-service
  config:
    import: "optional:file:.env[.properties]"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: ${GRACEFUL_SHUTDOWN_TIMEOUT}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: content
        jdbc:
          time_zone: UTC
  flyway:
    url: ${SPRING_FLYWAY_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    schemas: content

# Kafka в content-service удалён — sangraha-service теперь вызывает REST напрямую
# (POST /content/internal/sangraha/vocabulary).
# Бывшие топики: sangraha-vocabulary-events (consumer) и vocabulary-sync-results (producer).
# Kafka-конфигурация больше не нужна, но spring-kafka jar оставлен в build.gradle.kts —
# другие домены (eamenau) могут его использовать через общий autoconfig.
management:
  server:
    port: ${MANAGEMENT_PORT}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  propagation:
    type: w3c

logging:
  level:
    root: WARN
    sm.selflearn.samskrtam: DEBUG

