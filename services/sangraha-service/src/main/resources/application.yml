server:
  port: ${SANGRAHA_SERVICE_PORT}
  shutdown: graceful
  error:
    include-stacktrace: always
    include-exception: true

spring:
  application:
    name: sangraha-service
  lifecycle:
    timeout-per-shutdown-phase: ${GRACEFUL_SHUTDOWN_TIMEOUT}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: sangraha
        jdbc:
          time_zone: UTC
  flyway:
    schemas: sangraha
    locations: classpath:db/migration
    url: ${SPRING_FLYWAY_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: sangraha-vocabulary-event:sm.selflearn.samskrtam.sangraha.event.SangrahaVocabularyEvent

sangraha:
  llm:
    base-url: ${SANGRAHA_LLM_BASE_URL}
    api-key: ${SANGRAHA_LLM_API_KEY}
    model: ${SANGRAHA_LLM_MODEL}
    two-pass: ${SANGRAHA_LLM_TWO_PASS}

app:
  outbox:
    fixed-delay-ms: ${APP_OUTBOX_FIXED_DELAY_MS:5000}

management:
  server:
    port: ${MANAGEMENT_PORT}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  propagation:
    type: w3c

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED}

logging:
  level:
    root: WARN
    sm.selflearn.samskrtam: DEBUG
    org.springframework.kafka: DEBUG
    org.apache.kafka: WARN


