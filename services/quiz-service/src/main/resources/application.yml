server:
  port: ${QUIZ_SERVICE_PORT}
  error:
    include-stacktrace: always
    include-exception: true

spring:
  application:
    name: quiz-service
  config:
    import: "optional:file:.env[.properties]"

  # R2DBC — основной datasource для бизнес-логики
  r2dbc:
    url: ${SPRING_R2DBC_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    properties:
      schema: quiz

  # JDBC — только для Flyway (отдельный бин в FlywayConfig)
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: false   # отключаем auto, запускаем вручную из FlywayConfig
    schemas: quiz

  data:
    redis:
      host: ${REDIS_HOST}
      port: 6379

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: sm.selflearn.samskrtam.kafka.serialization.SamskrtamJsonSerializer
      properties:
        spring.json.add.type.headers: true # Добавляем информацию о типе в заголовки
        security.protocol: PLAINTEXT
        listener.name: EXTERNAL
    consumer: # Добавляем конфигурацию потребителя для консистентности
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: sm.selflearn.samskrtam.kafka.serialization.SamskrtamJsonDeserializer
      properties:
        spring.json.use.type.headers: true
        security.protocol: PLAINTEXT
        listener.name: EXTERNAL

content:
  service:
    url: ${CONTENT_SERVICE_URL}

curriculum-service:
  base-url: ${CURRICULUM_SERVICE_URL}

quiz:
  webclient:
    # WebClient response buffer limit (bytes) — matters for large curriculum lesson payloads
    max-in-memory-size: ${QUIZ_WEB_CLIENT_MAX_IN_MEMORY_SIZE}

  # Количество вопросов каждого типа declension-семейства за сессию,
  # источник пула кандидатов — curriculum-service (API v2), см. curriculum-quest-items.md §5.
  declension-session:
    single-choice-count: 4
    free-text-count: 1
    case-recognition-count: 4
    match-count: 1

logging:
  level:
    root: WARN
    sm.selflearn.samskrtam: DEBUG
    sm.selflearn.samskrtam.quiz.scheduler: WARN
    org.springframework.kafka: DEBUG
    org.apache.kafka: DEBUG

    org.springframework.web: WARN
    org.springframework.web.HttpLogging: DEBUG

    org.springframework.web.reactive: DEBUG
    org.springframework.web.server: DEBUG
    org.springframework.http.server.reactive: DEBUG
    org.springframework.web.reactive.function: DEBUG

    reactor.netty: WARN

app:
  outbox:
    fixed-delay-ms: 5000 # Задержка между проверками outbox-таблицы в миллисекундах

