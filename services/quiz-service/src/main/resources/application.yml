server:
  port: ${QUIZ_SERVICE_PORT}

spring:
  application:
    name: quiz-service
  config:
    import: "optional:file:.env[.properties]"
  threads:
    virtual:
      enabled: true
  r2dbc:
    url: ${SPRING_R2DBC_URL}?schema=quiz
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    url: ${SPRING_FLYWAY_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    schemas: quiz
