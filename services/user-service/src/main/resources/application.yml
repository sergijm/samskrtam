spring:
  application:
    name: user-service
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE}
      minimum-idle: ${DB_POOL_MIN_IDLE}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    schemas: users
    default-schema: users
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI}
  threads:
    virtual:
      enabled: true

server:
  port: ${USER_SERVICE_PORT:8087}
  shutdown: graceful

keycloak:
  url: ${KEYCLOAK_INTERNAL_URL} # Renamed from server-url
  realm: ${KEYCLOAK_REALM}
  client-id-admin: ${KEYCLOAK_CLIENT_ID_ADMIN} # Client for admin operations
  client-secret-admin: ${KEYCLOAK_CLIENT_SECRET_ADMIN}

minio:
  url:        ${MINIO_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  public-url: ${MINIO_PUBLIC_URL}
  bucket:
    avatars:    ${MINIO_BUCKET_AVATARS}
    documents:  ${MINIO_BUCKET_DOCUMENTS}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /api-docs

logging:
  level:
    root: INFO
    sm.selflearn.samskrtam: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.keycloak: DEBUG
    org.hibernate: DEBUG
