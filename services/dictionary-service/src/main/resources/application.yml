server:
  port: ${DICTIONARY_SERVICE_PORT}

spring:
  application:
    name: dictionary-service
  config:
    import: "optional:file:.env[.properties]"
  r2dbc:
    url: ${SPRING_R2DBC_URL}?schema=dictionary
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    url: ${SPRING_FLYWAY_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
    schemas: dictionary
