server:
  port: 8090

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          # Defined by env var in docker-compose.yml
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/samskrtam/protocol/openid-connect/certs}
  cloud:
    gateway:
      routes:
        - id: content-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/content/**

        - id: quiz-declensions-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/quiz-declensions/**

        - id: quiz-conjugations-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/quiz-conjugations/**

        - id: quiz-vocabulary-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/quiz-vocabulary/**

        - id: dictionary-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/dictionary/**

        - id: statistics-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/statistics/**
  data:
    redis:
      # Defined by env var in docker-compose.yml
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
