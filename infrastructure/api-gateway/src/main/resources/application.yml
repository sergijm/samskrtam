server:
  port: ${GATEWAY_PORT:8090}

spring:
  application:
    name: api-gateway

  config:
    import: "optional:file:.env[.properties]"

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URI}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: "#{@userKeyResolver}"
      # Маршруты перенесены в GatewayRoutesConfig.java
      routes: [] # Оставляем пустой список, чтобы не было ошибок конфигурации

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

# OAuth2 Client — Authorization Code flow, client_secret никогда не покидает сервер
oauth2:
  keycloak:
    base-url: ${KEYCLOAK_URL}
    internal-base-url: ${KEYCLOAK_INTERNAL_URL} # Добавлено для внутренних запросов без SSL
    realm: ${KEYCLOAK_REALM}
    client-id: ${KEYCLOAK_CLIENT_ID}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}
    redirect-uri: ${GATEWAY_URL}/api/v1/auth/oauth2/callback

frontend:
  url: ${FRONTEND_URL}

services:
  user-service-url: ${USER_SERVICE_URL}

logging:
  level:
    root: WARN
    sm.selflearn.samskrtam: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG # Изменено с TRACE на DEBUG
    org.springframework.web: DEBUG # Изменено с TRACE на DEBUG
