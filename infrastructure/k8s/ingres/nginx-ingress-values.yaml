controller:
  service:
    type: LoadBalancer
    loadBalancerIP: 192.168.162.111
  nodeSelector:
    kubernetes.io/os: linux
  kind: Deployment
  replicaCount: 1
  minAvailable: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  admissionWebhooks:
    enabled: true
    patch:
      enabled: true
      nodeSelector:
        kubernetes.io/os: linux
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
defaultBackend:
  enabled: true
  nodeSelector:
    kubernetes.io/os: linux