apiVersion: v1
kind: Namespace
metadata:
  name: redis

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: redis
data:
  redis.conf: |
    appendonly yes
    protected-mode no

  sentinel.conf: |
    port 26379
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes

    sentinel monitor mymaster redis-0.redis-headless.redis.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 10000
    sentinel failover-timeout mymaster 180000
    sentinel parallel-syncs mymaster 1

---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: redis
spec:
  clusterIP: None
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: redis
spec:
  serviceName: redis-headless
  replicas: 3

  selector:
    matchLabels:
      app: redis

  template:
    metadata:
      labels:
        app: redis

    spec:

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: redis
              topologyKey: kubernetes.io/hostname

      initContainers:

        - name: redis-config-init
          image: redis:7.2-alpine
          command:
            - sh
            - -c
            - |
              ORDINAL=$(hostname | awk -F'-' '{print $NF}')

              cp /config/redis.conf /tmp/redis.conf

              if [ "$ORDINAL" = "0" ]; then
                echo "# master" >> /tmp/redis.conf
              else
                cat <<EOF >> /tmp/redis.conf
              replicaof redis-0.redis-headless.redis.svc.cluster.local 6379
              EOF
              fi

              cp /tmp/redis.conf /workdir/redis.conf

          volumeMounts:
            - name: config
              mountPath: /config
            - name: generated-config
              mountPath: /workdir

      containers:

        - name: redis
          image: redis:7.2-alpine

          command:
            - redis-server
            - /etc/redis/redis.conf

          ports:
            - containerPort: 6379

          volumeMounts:
            - name: redis-data
              mountPath: /data

            - name: generated-config
              mountPath: /etc/redis

          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping

          livenessProbe:
            tcpSocket:
              port: 6379

        - name: sentinel
          image: redis:7.2-alpine

          command:
            - redis-sentinel
            - /etc/sentinel/sentinel.conf

          ports:
            - containerPort: 26379

          volumeMounts:
            - name: config
              mountPath: /etc/sentinel

      volumes:
        - name: config
          configMap:
            name: redis-config

        - name: generated-config
          emptyDir: {}

  volumeClaimTemplates:

    - metadata:
        name: redis-data
      spec:
        accessModes:
          - ReadWriteOnce

        storageClassName: local-path

        resources:
          requests:
            storage: 10Gi