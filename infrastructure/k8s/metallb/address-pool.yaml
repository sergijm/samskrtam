apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: sm-dev-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.162.230-192.168.162.250
  autoAssign: true

---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: sm-dev-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - sm-dev-pool