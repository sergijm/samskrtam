apiVersion: v1
kind: Namespace
metadata:
  name: kafka

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
  namespace: kafka

data:
  CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"

  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"

  KAFKA_CONTROLLER_QUORUM_VOTERS: >-
    0@kafka-0.kafka-headless.kafka.svc.cluster.local:9093,
    1@kafka-1.kafka-headless.kafka.svc.cluster.local:9093,
    2@kafka-2.kafka-headless.kafka.svc.cluster.local:9093

  KAFKA_LISTENERS: "INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094"

  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
    INTERNAL:PLAINTEXT,
    CONTROLLER:PLAINTEXT,
    EXTERNAL:PLAINTEXT

  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: kafka

spec:
  serviceName: kafka-headless
  replicas: 3
  podManagementPolicy: Parallel

  selector:
    matchLabels:
      app: kafka

  template:
    metadata:
      labels:
        app: kafka

    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: kafka

      containers:
        - name: kafka
          image: apache/kafka:3.7.0

          command:
            - /bin/bash
            - -c
            - |
              export POD_NAME=$(hostname)

              export KAFKA_NODE_ID=${POD_NAME##*-}

              export KAFKA_ADVERTISED_LISTENERS=INTERNAL://${POD_NAME}.kafka-headless.kafka.svc.cluster.local:9092,EXTERNAL://kafka-${POD_NAME##*-}.sm.dev:9094

              export KAFKA_LOG_DIRS=/var/lib/kafka/data

              exec /etc/kafka/docker/run

          envFrom:
            - configMapRef:
                name: kafka-config

          ports:
            - name: broker
              containerPort: 9092

            - name: controller
              containerPort: 9093

            - name: external
              containerPort: 9094

          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 60
            periodSeconds: 15

          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
            requests:
              cpu: 500m
              memory: 1Gi

            limits:
              cpu: "2"
              memory: 2Gi

          volumeMounts:
            - name: kafka-data
              mountPath: /var/kafka/data

  volumeClaimTemplates:
    - metadata:
        name: kafka-data

      spec:
        storageClassName: longhorn

        accessModes:
          - ReadWriteOnce

        resources:
          requests:
            storage: 20Gi