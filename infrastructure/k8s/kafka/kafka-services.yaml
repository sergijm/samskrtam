apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: kafka

spec:
  clusterIP: None

  publishNotReadyAddresses: true

  selector:
    app: kafka

  ports:
    - name: broker
      port: 9092

    - name: controller
      port: 9093

---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: kafka

spec:
  type: ClusterIP

  selector:
    app: kafka

  ports:
    - name: broker
      port: 9092
      targetPort: 9092

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-bootstrap
  namespace: kafka

spec:
  type: LoadBalancer

  loadBalancerIP: 192.168.162.240

  selector:
    app: kafka

  ports:
    - name: kafka
      port: 9094
      targetPort: 9094

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-0-external
  namespace: kafka

spec:
  type: LoadBalancer

  loadBalancerIP: 192.168.162.231

  selector:
    app: kafka
    statefulset.kubernetes.io/pod-name: kafka-0

  ports:
    - name: external
      port: 9094
      targetPort: 9094

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-1-external
  namespace: kafka

spec:
  type: LoadBalancer

  loadBalancerIP: 192.168.162.232

  selector:
    app: kafka
    statefulset.kubernetes.io/pod-name: kafka-1

  ports:
    - name: external
      port: 9094
      targetPort: 9094

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-2-external
  namespace: kafka

spec:
  type: LoadBalancer

  loadBalancerIP: 192.168.162.233

  selector:
    app: kafka
    statefulset.kubernetes.io/pod-name: kafka-2

  ports:
    - name: external
      port: 9094
      targetPort: 9094