openapi: 3.1.0
info:
  title: Akshara — Lesson API
  description: |
    API для страниц уроков. Агрегирует данные из content-service (содержание)
    и statistics-service (история ответов пользователя).

    Все эндпоинты требуют JWT. `userId` извлекается из заголовка `X-User-Id`,
    добавляемого api-gateway — клиент его не передаёт явно.
  version: 1.0.0

servers:
  - url: http://localhost:8090/api/v1
    description: Локальная разработка (через api-gateway)

tags:
  - name: vocabulary-lesson
    description: Словарные уроки
  - name: grammar-lesson
    description: Грамматические уроки
  - name: word-history
    description: История ответов на слова и вопросы

paths:

  # Vocabulary Lesson

  /lessons/vocabulary/{slug}:
    get:
      tags: [vocabulary-lesson]
      summary: Получить словарный урок с прогрессом пользователя
      description: >
        Возвращает список слов урока с индивидуальной статистикой каждого слова
        для текущего пользователя.
      operationId: getVocabularyLesson
      parameters:
        - $ref: 'openapi/parameters.yaml#/SlugParam'
      responses:
        '200':
          description: Урок с прогрессом пользователя
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas/vocabulary.yaml#/VocabularyLesson'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Grammar Lesson

  /lessons/grammar/{type}:
    get:
      tags: [grammar-lesson]
      summary: Получить грамматический урок с прогрессом пользователя
      description: >
        Возвращает список вопросов урока с правильными ответами и
        индивидуальной статистикой каждого вопроса для текущего пользователя.
      operationId: getGrammarLesson
      parameters:
        - $ref: 'openapi/parameters.yaml#/QuizTypeParam'
      responses:
        '200':
          description: Урок с прогрессом пользователя
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas/grammar.yaml#/GrammarLesson'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Word History

  /lessons/vocabulary/{slug}/words/{wordId}/history:
    get:
      tags: [word-history]
      summary: История ответов пользователя на конкретное слово в уроке
      description: >
        Возвращает хронологию попыток ответить на вопрос по данному слову
        в рамках конкретного урока (quizId из slug).
      operationId: getWordAnswerHistory
      parameters:
        - $ref: 'openapi/parameters.yaml#/SlugParam'
        - name: wordId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: 'openapi/parameters.yaml#/PageParam'
        - $ref: 'openapi/parameters.yaml#/SizeParam'
      responses:
        '200':
          description: История ответов на слово
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas/history.yaml#/WordAnswerHistory'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Lesson List (by type)

  /lessons/{lessonType}:
    get:
      tags: [vocabulary-lesson, grammar-lesson]
      summary: Get list of lessons by type with user progress
      description: >
        Returns a list of all lessons of the given type with user progress summary.
      operationId: getLessonsByType
      parameters:
        - name: lessonType
          in: path
          required: true
          schema:
            $ref: 'openapi/schemas/lessons.yaml#/LessonType'
      responses:
        '200':
          description: List of lessons
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas/lessons.yaml#/LessonListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Question History (обновлённый эндпоинт)

  /lessons/grammar/{slug}/questions/history:
    get:
      tags: [word-history]
      summary: История ответов пользователя на грамматический вопрос по падежу и числу
      description: >
        Возвращает хронологию попыток ответить на грамматический вопрос
        по комбинации падежа (caseType) и числа (numberType) в рамках
        конкретного урока. Отображается в QuestionHistoryDialog.

        Больше не использует questionId (UUID), так как вопрос не уникален —
        одна комбинация падежа/числа может встречаться у разных основ.
      operationId: getQuestionAnswerHistory
      parameters:
        - name: slug
          in: path
          required: true
          description: Slug грамматического урока (тип, например "DECLENSIONS")
          schema:
            type: string
            example: DECLENSIONS
        - name: caseType
          in: query
          required: true
          description: Тип падежа (NOMINATIVE, ACCUSATIVE, и т.д.)
          schema:
            type: string
            example: NOMINATIVE
        - name: numberType
          in: query
          required: true
          description: Тип числа (SINGULAR, PLURAL, DUAL)
          schema:
            type: string
            example: SINGULAR
        - $ref: 'openapi/parameters.yaml#/PageParam'
        - $ref: 'openapi/parameters.yaml#/SizeParam'
      responses:
        '200':
          description: История ответов на вопрос
          content:
            application/json:
              schema:
                $ref: 'openapi/schemas/history.yaml#/QuestionAnswerHistory'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'

# Components

components:

  responses:
    Unauthorized:
      description: JWT отсутствует или невалиден
      content:
        application/json:
          schema:
            $ref: 'openapi/schemas/common.yaml#/ErrorResponse'

    NotFound:
      description: Урок не найден
      content:
        application/json:
          schema:
            $ref: 'openapi/schemas/common.yaml#/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []