# Parameters for content-service API.
# Filter* params reuse the same descriptions as docs/openapi/quiz/parameters.yaml
# (values are forwarded byte-for-byte by quiz-service ContentClient.generateQuizData),
# but content-service does NOT depend on quiz-service's FilterScope Java enum —
# this is a query-string contract only (see content-service.md, "Внутреннее API").

LessonIdPathParam:
  name: quizId
  in: path
  required: true
  description: UUID of the lesson (path variable is named quizId in the controller).
  schema:
    type: string
    format: uuid

XUserLocaleHeader:
  name: X-User-Locale
  in: header
  required: false
  description: User locale for question text generation (e.g. "ru", "en").
  schema:
    type: string
    default: en
    example: ru

FilterScopeParam:
  $ref: '../quiz/parameters.yaml#/FilterScopeParam'

FilterCaseTypesParam:
  $ref: '../quiz/parameters.yaml#/FilterCaseTypesParam'

FilterNumberTypesParam:
  $ref: '../quiz/parameters.yaml#/FilterNumberTypesParam'

FilterCombinationsParam:
  $ref: '../quiz/parameters.yaml#/FilterCombinationsParam'

SlugPathParam:
  name: slug
  in: path
  required: true
  description: Slug of the lesson/quiz.
  schema:
    type: string
    example: declensions-a-masc

CategoryQueryParam:
  name: category
  in: query
  required: false
  description: Filters LessonContentController#getLessonsList by lesson category/slug prefix (actual filtering semantics defined in LessonContentService — not re-derived here, see code).
  schema:
    type: string

LessonIdQueryParam:
  name: id
  in: query
  required: true
  description: >
    UUID of the lesson. NOTE: this reuses the same path (GET /lessons) as the
    category-filtered list endpoint above, dispatched server-side via Spring's
    `params = "id"` request-mapping condition (LessonContentController#getLessonSummaryById).
    Since OpenAPI cannot express two operations on one path+method pair, both are
    documented as a single GET /lessons operation with mutually exclusive optional
    query parameters (see content-api.yaml).
  schema:
    type: string
    format: uuid

CaseTypeQueryParam:
  name: caseType
  in: query
  required: false
  schema:
    $ref: 'schemas/content.yaml#/CaseType'

NumberTypeQueryParam:
  name: numberType
  in: query
  required: false
  schema:
    $ref: 'schemas/content.yaml#/NumberType'

GenderQueryParam:
  name: gender
  in: query
  required: false
  schema:
    $ref: 'schemas/content.yaml#/Gender'

VowelTypeQueryParam:
  name: vowelType
  in: query
  required: true
  schema:
    $ref: 'schemas/content.yaml#/VowelType'

DeclensionStemIdPathParam:
  name: stemId
  in: path
  required: true
  description: UUID of the declension stem.
  schema:
    type: string
    format: uuid

ParadigmIndexQueryParam:
  name: index
  in: query
  required: false
  description: >
    0-based позиция запрашиваемого стема среди всех стемов урока (см.
    /content/public/lessons/{slug}/declension-paradigms). Порядок стабилен между запросами
    (по stemId/дате создания). Значение вне диапазона [0, totalCount) → 404.
  schema:
    type: integer
    minimum: 0
    default: 0

VocabularyWordIdPathParam:
  name: wordId
  in: path
  required: true
  schema:
    type: string
    format: uuid

QuizIdPathParam:
  name: quizId
  in: path
  required: true
  description: UUID of the lesson/quiz (VocabularyController reuses the quizId name for what LessonContentController calls lessonId — inconsistent naming kept as-is from the code).
  schema:
    type: string
    format: uuid

VocabularyLimitQueryParam:
  name: limit
  in: query
  required: false
  description: Max number of vocabulary words to return.
  schema:
    type: integer
    default: 100

ExerciseIdPathParam:
  name: id
  in: path
  required: true
  description: Integer PK of the Eamenau exercise (not a UUID, unlike the rest of the API).
  schema:
    type: integer

ExerciseIdForSandhiPathParam:
  name: exerciseId
  in: path
  required: true
  schema:
    type: integer

TaskIdPathParam:
  name: taskId
  in: path
  required: true
  schema:
    type: integer

SolutionIdPathParam:
  name: solutionId
  in: path
  required: true
  schema:
    type: integer
