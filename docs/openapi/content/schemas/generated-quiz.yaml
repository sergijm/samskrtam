# Schemas for the internal generate-quiz-data contract.
# Mirrors shared/samskrtam-dtos: sm.selflearn.samskrtam.content.dto.GeneratedQuizData /
# GeneratedQuizQuestionDto. Any field change here MUST be mirrored in the shared DTO
# and vice versa (Contract-First, see samskrtam-agents-spec.md, Agent 6).

GeneratedQuizData:
  type: object
  required: [lessonId, lessonType, questionsPerSession, generatedQuestions]
  properties:
    lessonId:
      type: string
      format: uuid
    lessonType:
      $ref: '../../common/schemas/lessons.yaml#/LessonType'
    questionsPerSession:
      type: integer
      minimum: 1
    generatedQuestions:
      type: array
      description: >
        Already filtered by filterScope/filterCaseTypes/filterNumberTypes/filterCombinations
        when those query params are provided (see generate-quiz-data operation description).
      items:
        $ref: '#/GeneratedQuizQuestionDto'
    vocabularyWords:
      type:
        - array
        - 'null'
      description: null for non-VOCABULARY lessons; not affected by the scope filter.
      items:
        $ref: '../../common/schemas/vocabulary.yaml#/VocabularyWordProgress'

GeneratedQuizQuestionDto:
  type: object
  required: [id, quizId, questionNumber]
  properties:
    id:
      type: string
      format: uuid
    quizId:
      type: string
      format: uuid
    questionNumber:
      type: integer
    text:
      type: string
    explanationRu:
      type: string
    explanationEn:
      type: string
    declensionStemId:
      type:
        - string
        - 'null'
      format: uuid
    stemDevanagari:
      type:
        - string
        - 'null'
    stemTranslationRu:
      type:
        - string
        - 'null'
    stemTranslationEn:
      type:
        - string
        - 'null'
    targetCase:
      type:
        - string
        - 'null'
      description: >
        CaseType enum (NOMINATIVE, ACCUSATIVE, ...). Used by the scope pre-filter
        for filterScope=CASE_ONLY/CASE_NUMBER_GENDER.
      example: NOMINATIVE
    targetNumber:
      type:
        - string
        - 'null'
      description: >
        NumberType enum (SINGULAR, DUAL, PLURAL). Used by the scope pre-filter
        for filterScope=NUMBER_ONLY/CASE_NUMBER_GENDER.
      example: SINGULAR
    correctFormIast:
      type: string
    correctFormDevanagari:
      type: string
    vocabularyWordId:
      type:
        - string
        - 'null'
      format: uuid
    questionSourceLanguage:
      type:
        - string
        - 'null'
    questionTargetLanguage:
      type:
        - string
        - 'null'
    correctTranslationRu:
      type:
        - string
        - 'null'
    correctTranslationEn:
      type:
        - string
        - 'null'
    userLocale:
      type:
        - string
        - 'null'
    stem:
      type:
        - string
        - 'null'
    caseType:
      type:
        - string
        - 'null'
    numberType:
      type:
        - string
        - 'null'
    gender:
      type:
        - string
        - 'null'
      description: >
        Gender from the declension stem (MASCULINE, FEMININE, NEUTER, UNSPECIFIED).
        Used by the scope pre-filter for filterScope=CASE_NUMBER_GENDER.
      example: MASCULINE
    caseEndingId:
      type:
        - string
        - 'null'
      format: uuid
    itemType:
      type:
        - string
        - 'null'
      enum: [VOCABULARY_WORD, DECLENSION_FORM]
    questionType:
      type:
        - string
        - 'null'
      enum: [FORM_BY_CASE, CASE_BY_FORM, ENDING_MATCH]
    caseEnding:
      type:
        - string
        - 'null'
      example: 'aḥ'
