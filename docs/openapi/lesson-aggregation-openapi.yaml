openapi: 3.1.0
info:
  title: Akshara — Lesson API
  description: |
    API для страниц уроков (словарные и грамматические уроки + история ответов).
    Реализуется quiz-service (LessonController / LessonHistoryController — v1,
    LessonV2Controller — v2). Исторически агрегировал content-service и
    statistics-service; сейчас содержимое уроков строится quiz-service.

    Все эндпоинты требуют JWT. `userId` извлекается из заголовка `X-User-Id`,
    добавляемого api-gateway — клиент его не передаёт явно.
  version: 2.0.0

servers:
  - url: http://localhost:8090/api/v1
    description: Локальная разработка (через api-gateway), v1-пути уроков
  - url: http://localhost:8090/api/v2
    description: Локальная разработка (через api-gateway), v2-пути уроков

tags:
  - name: vocabulary-lesson
    description: Словарные уроки
  - name: grammar-lesson
    description: Грамматические уроки
  - name: word-history
    description: История ответов на слова и вопросы
  - name: lesson-v2
    description: Уроки v2 (база уроков из curriculum-service)

paths:
  /lessons/vocabulary/{slug}:
    $ref: 'lesson-paths/v2.yaml#/paths/~1lessons~1vocabulary~1{slug}'
  /lessons/grammar/{slug}:
    $ref: 'lesson-paths/v1.yaml#/paths/~1lessons~1grammar~1{slug}'
  /lessons/vocabulary/{slug}/words/{wordId}/history:
    $ref: 'lesson-paths/v2.yaml#/paths/~1lessons~1vocabulary~1{slug}~1words~1{wordId}~1history'
  /lessons/{lessonType}:
    $ref: 'lesson-paths/v1.yaml#/paths/~1lessons~1{lessonType}'
  /lessons/grammar/{slug}/questions/history:
    $ref: 'lesson-paths/v2.yaml#/paths/~1lessons~1grammar~1{slug}~1questions~1history'
  /lessons:
    $ref: 'lesson-paths/v2.yaml#/paths/~1lessons'
  /lessons/{param}:
    $ref: 'lesson-paths/v2.yaml#/paths/~1lessons~1{param}'
  /lessons/grammar/{topicCode}:
    $ref: 'lesson-paths/v2.yaml#/paths/~1lessons~1grammar~1{topicCode}'
  /lessons/{slug}/declension-paradigms:
    $ref: 'lesson-paths/content.yaml#/paths/~1lessons~1{slug}~1declension-paradigms'
  /lessons/{slug}/examples:
    $ref: 'lesson-paths/content.yaml#/paths/~1lessons~1{slug}~1examples'

components:

  responses:
    Unauthorized:
      description: JWT отсутствует или невалиден
      content:
        application/json:
          schema:
            $ref: 'common/schemas/common.yaml#/ErrorResponse'

    NotFound:
      description: Урок не найден
      content:
        application/json:
          schema:
            $ref: 'common/schemas/common.yaml#/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
