# Shared parameters for Quiz Sessions APISlugParam:  name: slug  in: path  required: true  description: Slug of the quiz lesson (e.g. "declensions", "vocabulary")  schema:    type: string    example: declensionsSessionIdParam:  name: sessionId  in: path  required: true  description: UUID of the quiz session  schema:    type: string    format: uuidLessonIdParam:  name: lessonId  in: query  required: true  description: UUID of the lesson  schema:    type: string    format: uuidXUserIdHeader:  name: X-User-Id  in: header  required: true  description: User ID (set by API Gateway)  schema:    type: string    format: uuidXUserLocaleHeader:  name: X-User-Locale  in: header  required: true  description: User locale (e.g. "ru", "en")  schema:    type: string    example: ruFilterScopeParam:  name: filterScope  in: query  required: false  description: |    Filter scope for quiz session.    CASE_ONLY - aggregated by case (tab "Po padezham"), uses filterCaseTypes.    NUMBER_ONLY - aggregated by number (tab "Po chislam"), uses filterNumberTypes.    CASE_NUMBER_GENDER - detailed filter (tab "Podrobno"), uses filterCombinations.  schema:    type: string    enum: [CASE_ONLY, NUMBER_ONLY, CASE_NUMBER_GENDER]FilterCaseTypesParam:  name: filterCaseTypes  in: query  required: false  description: |    Comma-separated list of case type values (NOMINATIVE, ACCUSATIVE, etc.).    Used when filterScope=CASE_ONLY. Multiple rows selected on the case-summary tab.    Empty means "all cases" - expanded server-side to the full set at session start.  schema:    type: array    items:      type: string  explode: falseFilterNumberTypesParam:  name: filterNumberTypes  in: query  required: false  description: |    Comma-separated list of number type values (SINGULAR, DUAL, PLURAL).    Used when filterScope=NUMBER_ONLY. Multiple rows selected on the number-summary tab.    Empty means "all numbers" - expanded server-side to the full set at session start.  schema:    type: array    items:      type: string  explode: falseFilterCombinationsParam:  name: filterCombinations  in: query  required: false  description: |    Comma-separated list of (caseType:numberType:gender) triples, e.g.    "NOMINATIVE:SINGULAR:MASCULINE,ACCUSATIVE:PLURAL:FEMININE".    Used when filterScope=CASE_NUMBER_GENDER. Multiple rows selected on the detailed tab.    Gender UNSPECIFIED is used for stems without gender distinction (see ADR-005).    Empty means "all combinations" - expanded server-side to the full set at session start.  schema:    type: array    items:      type: string  explode: false