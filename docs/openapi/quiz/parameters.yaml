# Shared parameters for Quiz Sessions API

SlugParam:
  name: slug
  in: path
  required: true
  description: Slug of the quiz lesson (e.g. "declensions", "vocabulary")
  schema:
    type: string
    example: declensions

SessionIdParam:
  name: sessionId
  in: path
  required: true
  description: UUID of the quiz session
  schema:
    type: string
    format: uuid

LessonIdParam:
  name: lessonId
  in: query
  required: false
  description: |
    UUID of the lesson. Optional — ignored when `topicCode` is present.
    In the legacy v1 flow a lessonId maps to a content lesson; current topic-based
    sessions are driven by `topicCode` instead.
  schema:
    type: string
    format: uuid

TopicCodeParam:
  name: topicCode
  in: query
  required: false
  description: |
    Curriculum topic code (e.g. "a-stem-masc"). When present, the session is started
    from a curriculum topic and lessonId/filter parameters are ignored.
  schema:
    type: string

CountParam:
  name: count
  in: query
  required: false
  description: Number of questions in the session for topic-based starts.
  schema:
    type: integer
    default: 10

XUserIdHeader:
  name: X-User-Id
  in: header
  required: true
  description: User ID (set by API Gateway)
  schema:
    type: string
    format: uuid

XUserLocaleHeader:
  name: X-User-Locale
  in: header
  required: true
  description: User locale (e.g. "ru", "en")
  schema:
    type: string
    example: ru

ProgressTagSetIdParam:
  name: progressTagSetId
  in: query
  required: false
  description: |
    Stable id of a named progress-tag set used to start/resume a session scoped to a
    subset of a lesson's progress (see quest-engine.md §2.4, quiz-declension.md §3.4).
    NEW/LEARNING/MASTERED/DIFFICULT exist for every lesson; SINGULAR/DUAL/PLURAL and
    case pairs ACC_LOC/INS_ABL/GEN_LOC/DAT_ACC only for DECLENSION lessons. Resume is
    matched by the equality of progressTagSetId stored on the IN_PROGRESS session.
  schema:
    type: string
    enum: [NEW, LEARNING, MASTERED, DIFFICULT, SINGULAR, DUAL, PLURAL, ACC_LOC, INS_ABL, GEN_LOC, DAT_ACC]