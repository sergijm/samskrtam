# Answer DTOsAnswerRequest:  type: object  required: [questionId, responseTimeMs]  description: >    Exactly one of selectedOptionId / selectedOptionIds must be present, matching the    question's multiSelect flag (session.yaml#QuestionDto.multiSelect). Single-select    questionTypes (FORM_BY_CASE, CASE_BY_FORM) use selectedOptionId, unchanged from the    original contract. Multi-select ENDING_MATCH uses selectedOptionIds. Sending the    wrong field for a given question's multiSelect flag is a 400.  properties:    questionId:      $ref: 'common.yaml#/UUID'      description: ID of the question being answered    selectedOptionId:      $ref: 'common.yaml#/UUID'      description: >        ID of the selected option (generated on-the-fly, not persisted). Required when        the question's multiSelect=false (FORM_BY_CASE, CASE_BY_FORM).    selectedOptionIds:      type: array      items:        $ref: 'common.yaml#/UUID'      description: >        IDs of all selected options, unordered. Required when the question's        multiSelect=true (ENDING_MATCH, see session.yaml#QuestionDto). The set is        compared against the full set of correct CASE_COMBINATION options in the        question's pool — isCorrect requires an exact set match (no partial credit;        see quiz-declension.md §4.3 for the scoring rationale).    selectedFormIast:
      type: string
      description: IAST of the selected form (optional, for declension questions)
    selectedCaseType:
      type: string
      description: For CASE_BY_FORM/ENDING_MATCH — caseType of the selected option
    selectedNumberType:
      type: string
      description: For CASE_BY_FORM/ENDING_MATCH — numberType of the selected option
    selectedGender:
      type: string
      description: For CASE_BY_FORM/ENDING_MATCH — gender of the selected option
    matchSubmissions:
      type: array
      description: >
        Submissions for a MATCHING question (compose path): each word-form row paired
        with a chosen case+number label option. Null/empty for non-matching questions.
        The backend verifies the mapping against the materialized pairs; correct only
        if every pair matches exactly.
      items:
        $ref: '#/MatchSubmissionDto'
    responseTimeMs:
      type: integer
      description: Time taken to answer in milliseconds
      minimum: 0

MatchSubmissionDto:
  type: object
  required: [rowId, optionId]
  description: >
    One user submission for a MATCHING question: which label (optionId) was paired with
    which word form (rowId). rowId is the id of a QuestionMatchRowDto
    (session.yaml#QuestionMatchRowDto), optionId the id of a MATCH_LABEL option.
  properties:
    rowId:
      $ref: 'common.yaml#/UUID'
      description: id of the word-form row
    optionId:
      $ref: 'common.yaml#/UUID'
      description: id of the chosen case+number label optionAnswerResponse:  type: object  required: [isCorrect, correctAnswerText, questionNumber, totalQuestions]  properties:    isCorrect:      type: boolean      description: >        Whether the submitted answer was correct. For multiSelect questions, true only on        an exact match of selectedOptionIds against the full correct set (§ AnswerRequest).    correctOptionId:      $ref: 'common.yaml#/UUID'      description: >        ID of the correct option (may be null for form-based questions). Used for        single-select questionTypes only; null for multiSelect questions (see correctOptionIds).    correctOptionIds:      type: array      items:        $ref: 'common.yaml#/UUID'      description: >        IDs of all correct options. Present only for multiSelect questions (ENDING_MATCH),        so the client can highlight every correct combination the user missed, not just one.    correctAnswerText:      type: string      description: >        The correct answer text (IAST or translation for single-select; for multiSelect,        a comma-joined summary of all correct case/number/gender labels).    explanationRu:      type: string      description: Russian explanation for the correct answer    explanationEn:      type: string      description: English explanation for the correct answer    questionNumber:      type: integer      description: Number of the question that was answered    totalQuestions:      type: integer      description: Total number of questions in the sessionCompleteSessionResponse:  type: object  required: [sessionId, score, totalQuestions, durationMs]  properties:    sessionId:      $ref: 'common.yaml#/UUID'    score:      type: integer      description: Final score achieved    totalQuestions:      type: integer      description: Total number of questions in the session    durationMs:      type: integer      description: Session duration in millisecondsQuizProgressDto:  type: object  required: [sessionId, answeredQuestions, totalQuestions, found]  properties:    sessionId:      $ref: 'common.yaml#/UUID'    answeredQuestions:      type: integer    totalQuestions:      type: integer    found:      type: boolean      description: Whether an in-progress session was foundAnswerHistoryDto:  type: object  required: [questionId, questionNumber, questionText, isCorrect, answeredAt]  properties:    questionId:      $ref: 'common.yaml#/UUID'    questionNumber:      type: integer      description: Sequential (1-based) number of the question in the session    questionText:      type: string      description: The question text    selectedAnswerIast:      type: string      description: IAST text of the answer selected by the user    correctOptionIast:      type: string      description: IAST text of the correct answer    isCorrect:      type: boolean      description: Whether the answer was correct    responseTimeMs:      type: integer      description: Time taken to answer in milliseconds    answeredAt:      type: string      format: date-time      description: When the answer was submitted    explanationRu:      type: string      description: Russian explanation for the correct answer    explanationEn:      type: string      description: English explanation for the correct answerQuizSummaryDto:  type: object  required: [sessionId, lessonId, slug, lessonType, score, totalQuestions, answeredQuestions, correctAnswers, combinationsCount, status, startedAt]  properties:    sessionId:      $ref: 'common.yaml#/UUID'    lessonId:      $ref: 'common.yaml#/UUID'    lessonTitle:      type: string    lessonTitleRu:      type: string    lessonTitleEn:      type: string    slug:      type: string    lessonType:      $ref: 'common.yaml#/LessonType'    score:      type: integer    totalQuestions:      type: integer    answeredQuestions:      type: integer      description: Number of questions answered so far (used for the "% прохождения" column on the Sessions tab)    correctAnswers:      type: integer      description: Number of correctly answered questions    combinationsCount:      type: integer      description: Size of the session's filter set (filterCaseTypes/filterNumberTypes/filterCombinations, depending on filterScope)    status:      $ref: 'common.yaml#/SessionStatus'    startedAt:      type: string      format: date-time    completedAt:      type: string      format: date-time      nullable: true    durationMs:      type: integer      nullable: true    # NEW: filter info for filtered quiz sessions    filterInfo:      $ref: 'session.yaml#/FilterInfo'      description: Filter criteria for the session (present only for filtered sessions)PageQuizSummaryDto:  type: object  required: [content, totalPages, totalElements, number, size]  properties:    content:      type: array      description: List of quiz summaries on this page      items:        $ref: '#/QuizSummaryDto'    totalPages:      type: integer      description: Total number of pages    totalElements:      type: integer      description: Total number of elements across all pages    number:      type: integer      description: Current page number (0-based)    size:      type: integer      description: Page size    numberOfElements:      type: integer      description: Number of elements on this page    first:      type: boolean      description: Whether this is the first page    last:      type: boolean      description: Whether this is the last page    sort:      type: object      properties:        sorted:          type: boolean        unsorted:          type: boolean        empty:          type: boolean