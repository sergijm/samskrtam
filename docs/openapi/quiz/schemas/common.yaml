
# Common/shared schemas for Quiz Sessions API

ErrorResponse:
  type: object
  required: [errorCode, message, traceId]
  properties:
    errorCode:
      type: string
    message:
      type: string
    traceId:
      type: string

SessionStatus:
  type: string
  enum: [IN_PROGRESS, COMPLETED, ABANDONED]

LessonType:
  type: string
  enum: [DECLENSIONS, CONJUGATIONS, VOCABULARY, VOCABULARY_BASIC, VOCABULARY_TEXTS]

UUID:
  type: string
  format: uuid
  pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'