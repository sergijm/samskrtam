openapi: 3.1.0

info:
  title: Quiz Sessions API
  description: |
    API for managing quiz sessions across all quiz types (declensions, conjugations, vocabulary).
    Based on actual code at `services/quiz-service` — Java 21 + WebFlux (Reactor) + R2DBC.
    Manages the full lifecycle: start/resume, submitting answers, completion, retake, new-quiz.
    Distractors are generated on-the-fly (generate-on-read) and are NOT persisted.
    Questions are stored in quiz-service database (session_questions table) — the ONLY
    persistent storage of session questions in the entire system.
    Events (QuizAnsweredEvent, QuizSessionStatusChangedEvent) are published via Outbox Pattern.
  version: 1.0.0

servers:
  - url: http://localhost:8082/api/v1
    description: Local development (direct to quiz-service)
  - url: http://localhost:8090/api/v1
    description: Local development (via API Gateway)
  - url: http://localhost:8082/api/v2
    description: Local development (direct to quiz-service) — v2 paths (compose)

tags:
  - name: quiz-sessions
    description: Quiz session lifecycle management
  - name: user-quiz-sessions
    description: User quiz session history and progress retrieval
  - name: quest-compose
    description: Universal curriculum-driven quiz sessions (topics instead of lessons) — API v2

paths:
  /quiz/{slug}/sessions/start:
    $ref: 'paths/lifecycle.yaml#/paths/~1quiz~1{slug}~1sessions~1start'
  /quiz/{slug}/sessions/start-or-resume:
    $ref: 'paths/lifecycle.yaml#/paths/~1quiz~1{slug}~1sessions~1start-or-resume'
  /quiz/{slug}/sessions/{sessionId}/resume:
    $ref: 'paths/lifecycle.yaml#/paths/~1quiz~1{slug}~1sessions~1{sessionId}~1resume'
  /quiz/{slug}/sessions/{sessionId}/answer:
    $ref: 'paths/lifecycle.yaml#/paths/~1quiz~1{slug}~1sessions~1{sessionId}~1answer'
  /quiz/{slug}/sessions/{sessionId}/complete:
    $ref: 'paths/lifecycle.yaml#/paths/~1quiz~1{slug}~1sessions~1{sessionId}~1complete'
  /quiz/{slug}/sessions/{sessionId}/retake:
    $ref: 'paths/lifecycle.yaml#/paths/~1quiz~1{slug}~1sessions~1{sessionId}~1retake'
  /quiz/{slug}/sessions/{sessionId}/new-quiz:
    $ref: 'paths/lifecycle.yaml#/paths/~1quiz~1{slug}~1sessions~1{sessionId}~1new-quiz'
  /quiz/compose:
    $ref: 'paths/compose.yaml#/paths/~1quiz~1compose'
  /quiz-sessions:
    $ref: 'paths/history.yaml#/paths/~1quiz-sessions'
  /quiz-sessions/{sessionId}/summary:
    $ref: 'paths/history.yaml#/paths/~1quiz-sessions~1{sessionId}~1summary'
  /quiz-sessions/{sessionId}/answers:
    $ref: 'paths/history.yaml#/paths/~1quiz-sessions~1{sessionId}~1answers'
  /quiz-sessions/progress:
    $ref: 'paths/history.yaml#/paths/~1quiz-sessions~1progress'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

security:
  - bearerAuth: []
