# Схемы sangraha-service
# Импортируются из sangraha-service.yaml через $ref: 'sangraha-schemas.yaml#/WorkSummary'

WorkSummary:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    titleRu:
      type: string
    titleEn:
      type: string
    titleSaIast:
      type: string
    titleSaDevanagari:
      type: string
    descriptionRu:
      type: string
      nullable: true
    descriptionEn:
      type: string
      nullable: true
    author:
      type: string
      nullable: true

WorkTree:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    titleRu:
      type: string
    titleEn:
      type: string
    titleSaIast:
      type: string
    titleSaDevanagari:
      type: string
    descriptionRu:
      type: string
      nullable: true
    descriptionEn:
      type: string
      nullable: true
    author:
      type: string
      nullable: true
    chapters:
      type: array
      items:
        $ref: '#/ChapterSummary'

ChapterSummary:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    orderIndex:
      type: integer
      nullable: true
    titleRu:
      type: string
    titleEn:
      type: string
    titleSaIast:
      type: string
      nullable: true
    titleSaDevanagari:
      type: string
      nullable: true
    categoryCode:
      type: string
      description: "{workSlug}.{chapterSlug} — код категории лексики"
    verseCount:
      type: integer
      description: Количество стихов в главе (для отображения на плитке)

ChapterWithVerses:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    orderIndex:
      type: integer
      nullable: true
    titleRu:
      type: string
    titleEn:
      type: string
    titleSaIast:
      type: string
      nullable: true
    titleSaDevanagari:
      type: string
      nullable: true
    categoryCode:
      type: string
      description: "{workSlug}.{chapterSlug} — код категории лексики"
    verses:
      type: array
      items:
        $ref: '#/VersePreview'

VersePreview:
  type: object
  properties:
    id:
      type: string
      format: uuid
    orderIndex:
      type: integer
    textIastPreview:
      type: string
      description: Первые ~80 символов textIast для отображения в списке
      nullable: true
    textIast:
      type: string
      nullable: true
    textDevanagari:
      type: string
      nullable: true
    translationRu:
      type: string
      nullable: true
    translationEn:
      type: string
      nullable: true
    status:
      $ref: '#/VerseStatus'

VerseDetail:
  type: object
  properties:
    id:
      type: string
      format: uuid
    chapterId:
      type: string
      format: uuid
    orderIndex:
      type: integer
    rawText:
      type: string
      nullable: true
      description: >-
        Сырой ввод пользователя (последнее сохранённое значение поля text),
        до определения письменности. Используется фронтендом в режиме
        редактирования стиха (status = DRAFT/FAILED) вместо
        textDevanagari/textIast — см. sangraha-service.md §7.
    textDevanagari:
      type: string
      nullable: true
    textIast:
      type: string
      nullable: true
    status:
      $ref: '#/VerseStatus'
    analysis:
      $ref: '#/VerseAnalysisDto'
      nullable: true
    words:
      type: array
      items:
        $ref: '#/VerseWordDto'
      nullable: true
    verseTopicCode:
      type: string
      nullable: true
      description: >-
        Код VERSE-урока, на который ведёт кнопка «Изучить» (см.
        lexicon-content-pipeline.md §7): «{workSlp1}_{chapterNumber}» для стиха
        в главе, «user-{ownerId}» для standalone-стиха. Возвращается и в ответе
        POST /verses/{verseId}/study.

VerseAnalysisDto:
  type: object
  properties:
    translationRu:
      type: string
    translationEn:
      type: string
    sandhiSplits:
      type: array
      items:
        type: object
        properties:
          surface:
            type: string
          components:
            type: array
            items:
              type: string
          ruleNumbers:
            type: array
            items:
              type: integer
            description: >-
              Номера правил из emenau-sandhi-rules.json (только
              applicability=external, диапазон 41–71), применённые к этому переходу,
              в порядке применения. Пустой массив — LLM не уверена в конкретном
              правиле (см. sangraha-prompts/verse-analysis.md).
    modelName:
      type: string
    analyzerName:
      type: string
      description: >-
        Имя LLM-модели, которая фактически выполнила анализ (сохраняется
        отдельно от modelName для совместимости; заполняется тем же значением,
        см. sangraha-service.md §5.4).
    analyzedAt:
      type: string
      format: date-time

# Сырая сущность verse_analyses — ответ GET /verses/{verseId}/analysis
# (в отличие от VerseAnalysisDto sandhiSplits/rawModelResponse/rawPrompt
# отдаются как текст: сырой JSON ответа модели и сохранённый промпт).
VerseAnalysis:
  type: object
  description: >-
    Сырая запись VerseAnalysis (сущность, без маппинга в VerseAnalysisDto).
    Основной читающий путь фронтенда — GET /verses/{verseId} (вложенный
    analysis в VerseDetail); этот эндпоинт служит для отладки/выгрузки.
  properties:
    verseId:
      type: string
      format: uuid
    translationRu:
      type: string
    translationEn:
      type: string
    sandhiSplits:
      type: string
      nullable: false
      description: Сырой JSON массива сандхи-разбиений (как вернула LLM).
    rawModelResponse:
      type: string
      nullable: true
      description: Сырой JSON ответа модели.
    rawPrompt:
      type: string
      nullable: true
      description: Сохранённый промпт, отправленный модели.
    modelName:
      type: string
    analyzerName:
      type: string
    analyzedAt:
      type: string
      format: date-time

VerseWordDto:
  type: object
  description: >-
    Полный грамматический разбор одной словоформы стиха. Детальное описание
    смысла каждой группы полей — sangraha-service/verse-word-grammar.md.
  properties:
    id:
      type: string
      format: uuid
    position:
      type: integer
    surfaceIast:
      type: string
    surfaceDevanagari:
      type: string
    lemmaIast:
      type: string
    stem:
      type: string
      nullable: true
    root:
      type: string
      nullable: true
    pos:
      type: string
      nullable: true
    formType:
      type: string
      nullable: true
      description: >-
        FINITE|INFINITIVE|ABSOLUTIVE|PARTICIPLE|GERUNDIVE|OTHER_NONFINITE|
        NOMINAL|ADJECTIVAL|PRONOMINAL|INDECLINABLE
    isFinite:
      type: boolean
      nullable: true
    morphology:
      $ref: '#/VerseWordMorphologyDto'
      nullable: true
    derivation:
      $ref: '#/VerseWordDerivationDto'
      nullable: true
    lemmaGlossRu:
      type: string
      nullable: true
    lemmaGlossEn:
      type: string
      nullable: true
    contextGlossRu:
      type: string
    contextGlossEn:
      type: string
    formationRuleNumbers:
      type: array
      items:
        type: integer
      description: >-
        Номера правил из emenau-sandhi-rules.json (только
        applicability=internal, диапазон 1–40), объясняющие, как образована именно
        эта словоформа из корня/основы (морфофонемные изменения при присоединении
        суффикса/окончания) — в порядке применения. Пустой массив, если словоформа
        не требует объяснения через внутренние сандхи (простое присоединение без
        изменений) или модель не уверена (не угадывать номер).
    analysisConfidence:
      type: string
      nullable: true
      description: >-
        HIGH|MEDIUM|LOW. Присутствует в DTO для тестирования/отладки,
        на VersePage не отображается (см. sangraha-service.md §7).
    ambiguityNotes:
      type: string
      nullable: true
    vocabularyWordId:
      type: string
      format: uuid
      nullable: true

# Сырая сущность verse_words — ответ GET /verses/{verseId}/words
# (сущности без маппинга в VerseWordDto; поля морфологии/деривации/verse —
# вложенные сущности).
VerseWord:
  type: object
  description: >-
    Словоформа стиха как сущность verse_words (без маппинга в VerseWordDto).
    Основной читающий путь фронтенда — GET /verses/{verseId} (вложенные words
    в VerseDetail); этот эндпоинт служит для отладки/выгрузки. Поля
    morphology/derivation/verse — вложенные сущности, вложение verse может
    отсутствовать при сериализации вне транзакции.
  properties:
    id:
      type: string
      format: uuid
    position:
      type: integer
    surfaceIast:
      type: string
    surfaceDevanagari:
      type: string
    lemmaIast:
      type: string
    stem:
      type: string
      nullable: true
    root:
      type: string
      nullable: true
    pos:
      type: string
      nullable: true
      description: Часть речи (NOUN|VERB|…), см. PartOfSpeech.
    formType:
      type: string
      nullable: true
      description: >-
        FINITE|INFINITIVE|ABSOLUTIVE|PARTICIPLE|GERUNDIVE|OTHER_NONFINITE|
        NOMINAL|ADJECTIVAL|PRONOMINAL|INDECLINABLE
    isFinite:
      type: boolean
      nullable: true
    lemmaGlossRu:
      type: string
      nullable: true
    lemmaGlossEn:
      type: string
      nullable: true
    contextGlossRu:
      type: string
    contextGlossEn:
      type: string
    formationRuleNumbers:
      type: string
      nullable: true
      description: >-
        Номера правил из emenau-sandhi-rules.json (внутренние, диапазон 1–40)
        как сырая строка (TEXT-колонка). В VerseWordDto — массив чисел.
    analysisConfidence:
      type: string
      nullable: true
      description: HIGH|MEDIUM|LOW
    ambiguityNotes:
      type: string
      nullable: true
    vocabularyWordId:
      type: string
      format: uuid
      nullable: true
    verse:
      type: object
      nullable: true
      description: Вложенный стих (сущность Verse); поля совпадают с WorkTree-представлением.
    morphology:
      type: object
      nullable: true
      description: То же, что VerseWordMorphologyDto (caseType/gender/numberType/person/tense/mood/voice).
    derivation:
      type: object
      nullable: true
      description: То же, что VerseWordDerivationDto (derivationType/derivationalSuffix/derivationalBase/description).

VerseWordMorphologyDto:
  type: object
  nullable: true
  description: >-
    Инфлективная морфология словоформы. Объект целиком отсутствует
    (null), если для слова нет применимой морфологии; отдельные поля
    внутри тоже могут быть null (не применимы к данной части речи/форме).
  properties:
    caseType:
      type: string
      nullable: true
    gender:
      type: string
      nullable: true
    numberType:
      type: string
      nullable: true
    person:
      type: string
      nullable: true
    tense:
      type: string
      nullable: true
    mood:
      type: string
      nullable: true
    voice:
      type: string
      nullable: true

VerseWordDerivationDto:
  type: object
  nullable: true
  description: >-
    Деривационная/словообразовательная информация словоформы. Объект
    целиком отсутствует (null), если словообразование не установлено.
  properties:
    derivationType:
      type: string
      nullable: true
      description: >-
        SIMPLE_INFLECTION|ABSOLUTIVE|PARTICIPLE|GERUNDIVE|INFINITIVE|
        CAUSATIVE|DESIDERATIVE|DENOMINATIVE|COMPOUND_VERB|OTHER
    derivationalSuffix:
      type: string
      nullable: true
    derivationalBase:
      type: string
      nullable: true
    description:
      type: string
      nullable: true

VerseStatus:
  type: string
  enum: [DRAFT, ANALYZING, ANALYZED, FAILED]

VerseTextRequest:
  type: object
  required: [text]
  properties:
    text:
      type: string
      description: >-
        Единое поле ввода — может содержать текст на деванагари или в IAST.
        Тело POST /verses/{verseId}/analyze: значение сохраняется как есть
        в Verse.rawText, затем backend определяет письменность и заполняет
                textDevanagari / textIast (см. sangraha-service.md §4, §7).

AnalyzeAllVersesResponse:
  type: object
  required: [chapterId, verseIds]
  properties:
    chapterId:
      type: string
      format: uuid
    verseIds:
      type: array
      items:
        type: string
        format: uuid
      description: >-
        Идентификаторы всех стихов главы, переведённых в статус ANALYZING
        этим запросом (см. sangraha-service.md §5.4).

VerseBatchItem:
  type: object
  required: [id, workSlug, workTitleRu, workTitleEn, chapterSlug, chapterTitleRu, chapterTitleEn, verseOrderIndex, textIastPreview, status]
  description: >-
    Один стих в ответе POST /verse (sangraha-service/batch-verse-review.md).
    В отличие от внутреннего /sangraha/internal/content/verses/batch — отдаёт
    слаги, превью текста и status любого стиха (без фильтра по ANALYZED).
  properties:
    id:
      type: string
      format: uuid
    workSlug:
      type: string
    workTitleRu:
      type: string
    workTitleEn:
      type: string
    chapterSlug:
      type: string
    chapterTitleRu:
      type: string
    chapterTitleEn:
      type: string
    verseOrderIndex:
      type: integer
    textIastPreview:
      type: string
      description: Первые ~80 символов textIast (та же обрезка, что в дереве главы)
      nullable: true
    status:
      $ref: '#/VerseStatus'

VersesBatchRequest:
  type: object
  required: [verseIds]
  properties:
    verseIds:
      type: array
      items:
        type: string
        format: uuid
      description: >-
        Произвольный список verseId, стихи по порядку следования в массиве.
        Не найденные/удалённые id отсутствуют в ответе без ошибки.

VersesBatchResponse:
  type: object
  required: [verses]
  properties:
    verses:
      type: array
      items:
        $ref: '#/VerseBatchItem'
      description: >-
        Стихи в порядке id запроса; не найденные/удалённые id отсутствуют
        без ошибки.

AnalyzeVersesRequest:
  type: object
  required: [verseIds]
  properties:
    verseIds:
      type: array
      items:
        type: string
        format: uuid

AnalyzeVersesResponse:
  type: object
  required: [verseIds]
  properties:
    verseIds:
      type: array
      items:
        type: string
        format: uuid
      description: >-
        Id реально загруженных стихов, принятых к анализу (не найденные/удалённые
        исключены молча).

# --- Поиск примеров стихов по точной словоформе (урок склонений) ---
VerseWordExamplesRequest:
  type: object
  required: [surfaceIasts]
  properties:
    surfaceIasts:
      type: array
      minItems: 1
      description: Точные поверхностные формы (IAST), например ["devaḥ", "devam"].
      items:
        type: string

VerseWordExamplesResponse:
  type: object
  required: [results]
  properties:
    results:
      type: array
      description: >-
        Ровно один элемент на каждую форму запроса (даже с пустым verses — форма
        не найдена в корпусе). Порядок повторяет порядок surfaceIasts в запросе.
        Для каждой формы возвращается ровно один самый короткий стих (3–7 слов,
        с глаголом).
      items:
        type: object
        required: [surfaceIast, verses]
        properties:
          surfaceIast:
            type: string
          verses:
            type: array
            maxItems: 1
            items:
              $ref: '#/VerseWordExampleItem'

VerseWordExampleItem:
  type: object
  required: [verseId, workSlug, textIast, textDevanagari, translationRu, translationEn, workTitleRu, workTitleEn, chapterTitleRu, chapterTitleEn, verseOrderIndex]
  description: >-
    Один стих-пример. Перевод (translationRu/En) может отсутствовать — стих
    тогда отдаётся без перевода.
  properties:
    verseId:
      type: string
      format: uuid
    workSlug:
      type: string
    textIast:
      type: string
    textDevanagari:
      type: string
    translationRu:
      type: string
      nullable: true
    translationEn:
      type: string
      nullable: true
    workTitleRu:
      type: string
    workTitleEn:
      type: string
    chapterTitleRu:
      type: string
    chapterTitleEn:
      type: string
    verseOrderIndex:
      type: integer

# --- Поиск примеров склонений по словоизменительному классу (вкладка урока склонений) ---
# Публичный DTO POST /api/v1/sangraha/verses/examples →
# VerseWordSearchService.searchExamples (docs/services/sangraha-service.md §9).
# gender/caseType/numberType опциональны — фильтр по соответствующей оси не применяется.
DeclensionExamplesRequest:
  type: object
  required: [vowelType, limitPerGroup]
  properties:
    vowelType:
      type: string
      enum: [A_STEM, AA_STEM, I_STEM, II_STEM, U_STEM, UU_STEM, R_STEM, PRON_AHAM, PRON_TVAM, PRON_TAD, PRON_ETAD, PRON_IDAM, PRON_KIM, PRON_YAD, PRON_REFLEXIVE]
    gender:
      type: string
      enum: [MASCULINE, FEMININE, NEUTER, UNKNOWN, UNSPECIFIED]
      description: >-
        Опциональный фильтр по роду; не заполнено — стихи с любым родом. UNKNOWN
        осознанно матчит пусто (в корпусе таких значений нет).
    caseType:
      type: string
      enum: [NOMINATIVE, ACCUSATIVE, INSTRUMENTAL, DATIVE, ABLATIVE, GENITIVE, LOCATIVE, VOCATIVE]
      description: Опциональный фильтр по падежу; не заполнено — любой падеж.
    numberType:
      type: string
      enum: [SINGULAR, DUAL, PLURAL]
      description: Опциональный фильтр по числу; не заполнено — любое число.
    limitPerGroup:
      type: integer
      minimum: 1
      description: Максимум примеров на одну ячейку (caseType, numberType).
    maxPhraseWords:
      type: integer
      description: Максимальная длина стиха в словах для кандидатов (default 10).

DeclensionExamplesResponse:
  type: object
  required: [groups]
  properties:
    groups:
      type: array
      description: >-
        По одной группе на каждую непустую ячейку парадигмы склонения. Пустые
        ячейки не включаются в ответ.
      items:
        type: object
        required: [caseType, numberType, examples]
        properties:
          caseType:
            type: string
            enum: [NOMINATIVE, ACCUSATIVE, INSTRUMENTAL, DATIVE, ABLATIVE, GENITIVE, LOCATIVE, VOCATIVE]
          numberType:
            type: string
            enum: [SINGULAR, DUAL, PLURAL]
          examples:
            type: array
            items:
              $ref: '#/VerseWordExampleItem'

# --- Классификатор произведений (works_class) ---
WorksClassTreeNode:
  type: object
  properties:
    id:
      type: string
      format: uuid
    parentId:
      type: string
      format: uuid
      nullable: true
    code:
      type: string
    titleRu:
      type: string
    titleEn:
      type: string
    titleSaIast:
      type: string
    titleSaDeva:
      type: string
      nullable: true
    sortOrder:
      type: integer
    children:
      type: array
      items:
        $ref: '#/WorksClassTreeNode'

WorksClassGroup:
  type: object
  required: [classification, classes]
  properties:
    classification:
      type: string
    classes:
      type: array
      items:
        $ref: '#/WorksClassTreeNode'

# --- Standalone анализ (страница /analysis, verse.chapter_id = null) ---
StandaloneVerseItem:
  type: object
  required: [id]
  properties:
    id:
      type: string
      format: uuid
    preview:
      type: string
      nullable: true
      description: >-
        Превью текста (textIast → textDevanagari → rawText), обрезанное до 120
        символов. У standalone-стиха нет контекста произведения/главы.
    status:
      $ref: '#/VerseStatus'
    createdAt:
      type: string
      format: date-time
