# Schemas for docs/openapi/sangraha/internal-content-api.yaml.
# vowelType/gender/caseType/numberType значения намеренно совпадают по имени с
# content.VowelType/Gender/CaseType/NumberType (docs/openapi/content/schemas/content.yaml) —
# sangraha-service своего собственного понятия vowelType не имеет, определяет его на лету
# по VerseWord.stem для регулярных классов; для PRON_* — по фиксированному lemmaIast
# (см. sangraha-service.md §9).

VersesBatchRequestDto:
  type: object
  required: [verseIds]
  properties:
    verseIds:
      type: array
      items:
        type: string
        format: uuid

VersesBatchResponseDto:
  type: object
  required: [verses]
  properties:
    verses:
      type: array
      description: Только status=ANALYZED, не мягко удалённые. Не найденные verseId просто отсутствуют.
      items:
        type: object
        required: [verseId, workSlug, textIast, textDevanagari, translationRu, translationEn, workTitleRu, workTitleEn, chapterTitleRu, chapterTitleEn, verseOrderIndex]
        properties:
          verseId:
            type: string
            format: uuid
          workSlug:
            type: string
          textIast:
            type: string
          textDevanagari:
            type: string
          translationRu:
            type: string
          translationEn:
            type: string
          workTitleRu:
            type: string
          workTitleEn:
            type: string
          chapterTitleRu:
            type: string
          chapterTitleEn:
            type: string
          verseOrderIndex:
            type: integer

VerseWordExportPageDto:
  type: object
  required: [items, nextCursor]
  properties:
    items:
      type: array
      items:
        $ref: '#/VerseWordExportItemDto'
    nextCursor:
      type: string
      format: uuid
      nullable: true
      description: Последний verseId страницы; null — строк больше нет.

VerseWordExportItemDto:
  type: object
  required: [verseId, verseOrderIndex]
  description: >
    Одна словоформа одной строкой (lexicon-content-pipeline.md §2). Род и класс
    основы берутся из verse_word_morphology и могут отсутствовать.
  properties:
    verseId:
      type: string
      format: uuid
    workSlug:
      type: string
      nullable: true
    chapterSlug:
      type: string
      nullable: true
    verseOrderIndex:
      type: integer
    lemmaIast:
      type: string
    stem:
      type: string
      nullable: true
    surfaceIast:
      type: string
    surfaceDevanagari:
      type: string
    pos:
      type: string
      nullable: true
    lemmaGlossRu:
      type: string
      nullable: true
    lemmaGlossEn:
      type: string
      nullable: true
    gender:
      type: string
      enum: [MASCULINE, FEMININE, NEUTER, UNSPECIFIED]
      nullable: true
    vowelType:
      type: string
      nullable: true
      description: Класс основы (A_STEM … R_STEM), определённый на лету по stem.

NominalLemmaCandidatesResponseDto:
  type: object
  required: [candidates]
  properties:
    candidates:
      type: array
      items:
        $ref: '#/NominalLemmaCandidateDto'

NominalLemmaCandidateDto:
  type: object
  required: [lemmaIast, lemmaDevanagari, lemmaSlp1, stemIast, stemClass, confidence, frequency]
  description: >
    Кандидат на импорт существительного (номинальная лемма) в curriculum-лексикон
    для бутстрапа квизов/парадигм склонений. Род — самый частый по лемме из
    verse_word_morphology (может быть null).
  properties:
    lemmaIast:
      type: string
      description: Словарная форма IAST (ключ, UNIQUE в nominal_lemmas)
    lemmaDevanagari:
      type: string
    lemmaSlp1:
      type: string
    stemIast:
      type: string
      description: Основа склонения IAST (источник для WordFormBuilder)
    stemClass:
      type: string
      description: Регулярный класс основы (A_STEM … R_STEM)
    confidence:
      type: string
      enum: [HIGH, MEDIUM, LOW]
    gender:
      type: string
      enum: [MASCULINE, FEMININE, NEUTER, UNSPECIFIED]
      nullable: true
    frequency:
      type: integer
      description: Число вхождений леммы в verse_words (порядок сортировки)
