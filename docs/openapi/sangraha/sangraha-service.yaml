openapi: "3.1.0"
info:
  title: Sangraha Service API
  description: |
    API для чтения санскритских произведений (Work → Chapter → Verse) и LLM-анализа стихов.
    Work/Chapter CRUD удалён — произведения и главы управляются через импорт.
    Verse CRUD удалён — стихи создаются через импорт, текст сохраняется через POST …/analyze.

    Все write-эндпоинты требуют роль ADMIN.
  version: "1.0.0"
  contact:
    name: Samskrtam Team

servers:
  - url: /api/v1/sangraha
    description: Через API Gateway (prefix /api/v1/sangraha)

paths:
  /works:
    $ref: 'paths/works.yaml#/paths/~1works'
  /works/classes:
    $ref: 'paths/works.yaml#/paths/~1works~1classes'
  /works/{workSlug}:
    $ref: 'paths/works.yaml#/paths/~1works~1{workSlug}'
  /chapters/{chapterId}/verses:
    $ref: 'paths/chapters.yaml#/paths/~1chapters~1{chapterId}~1verses'
  /chapters/{chapterId}/verses/analyze-all:
    $ref: 'paths/chapters.yaml#/paths/~1chapters~1{chapterId}~1verses~1analyze-all'
  /verse:
    $ref: 'paths/verses.yaml#/paths/~1verse'
  /verse/analysis:
    $ref: 'paths/verses.yaml#/paths/~1verse~1analysis'
  /verses/{verseId}:
    $ref: 'paths/verses.yaml#/paths/~1verses~1{verseId}'
  /verses/{verseId}/vocabulary-quiz:
    $ref: 'paths/verses.yaml#/paths/~1verses~1{verseId}~1vocabulary-quiz'
  /verses/{verseId}/analysis:
    $ref: 'paths/verses.yaml#/paths/~1verses~1{verseId}~1analysis'
  /verses/{verseId}/words:
    $ref: 'paths/verses.yaml#/paths/~1verses~1{verseId}~1words'
  /verses/{verseId}/analyze:
    $ref: 'paths/verses.yaml#/paths/~1verses~1{verseId}~1analyze'
  /analysis:
    $ref: 'paths/analysis.yaml#/paths/~1analysis'
  /analysis/{verseId}:
    $ref: 'paths/analysis.yaml#/paths/~1analysis~1{verseId}'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
