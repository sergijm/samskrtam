openapi: "3.1.0"
info:
  title: Sangraha Service API
  description: |
    API для управления санскритскими произведениями (Work → Chapter → Verse),
    LLM-анализа стихов и синхронизации лексики через Kafka.
    
    Все write-эндпоинты требуют роль ADMIN.
  version: "1.0.0"
  contact:
    name: Samskrtam Team

servers:
  - url: /api/v1/sangraha
    description: Через API Gateway (prefix /api/v1/sangraha)

paths:
  /works:
    get:
      operationId: listWorks
      summary: Плитки произведений
      tags: [Works]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: false
          description: UUID произведения (для получения дерева по UUID, административный доступ)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: |
            Если id не указан — список произведений (WorkSummary[]).
            Если id указан — дерево произведения (WorkTree).
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: 'sangraha-schemas.yaml#/WorkSummary'
                  - $ref: 'sangraha-schemas.yaml#/WorkTree'
        '404':
          description: Произведение с указанным id не найдено
    post:
      operationId: createWork
      summary: Создать произведение (авто-детекция языка, LLM-генерация)
      description: |
        Принимает одно текстовое поле title (на любом из трёх языков) и опционально description.
        Backend детектит язык, через LLM генерирует titleRu/En/SaIast/SaDevanagari,
        вычисляет slug из titleSaIast через IAST→SLP1. См. §5.2 sangraha-service.md.
      tags: [Works]
      security:
        - bearerAuth:
            - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'sangraha-schemas.yaml#/CreateWorkRequest'
      responses:
        '201':
          description: Произведение создано. WorkSummary содержит новые поля titleSaIast/titleSaDevanagari.
          content:
            application/json:
              schema:
                $ref: 'sangraha-schemas.yaml#/WorkSummary'
        '400':
          description: Некорректные данные
        '500':
          description: Ошибка LLM — Work не создаётся

  /works/{workSlug}:
    get:
      operationId: getWorkTreeBySlug
      summary: Произведение + дерево глав/стихов по slug
      description: |
        Основной эндпоинт для страницы произведения (фронтенд: /sangraha/{workSlug}).
        Возвращает id, slug, titleSaIast, titleSaDevanagari, titleRu/En и chapters[].verses[] — двухуровневое дерево.
      tags: [Works]
      security:
        - bearerAuth: []
      parameters:
        - name: workSlug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*$'
      responses:
        '200':
          description: Дерево произведения
          content:
            application/json:
              schema:
                $ref: 'sangraha-schemas.yaml#/WorkTree'
        '404':
          description: Произведение не найдено

    put:
      operationId: updateWork
      summary: Обновить метаданные произведения
      tags: [Works]
      security:
        - bearerAuth:
            - ADMIN
      parameters:
        - name: workSlug
          in: path
          required: true
          description: Slug произведения
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'sangraha-schemas.yaml#/UpdateWorkRequest'
      responses:
        '200':
          description: Произведение обновлено
          content:
            application/json:
              schema:
                $ref: 'sangraha-schemas.yaml#/WorkSummary'

    delete:
      operationId: deleteWork
      summary: Soft delete произведения
      tags: [Works]
      security:
        - bearerAuth:
            - ADMIN
      parameters:
        - name: workSlug
          in: path
          required: true
          description: Slug произведения
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*$'
      responses:
        '204':
          description: Произведение помечено как удалённое

  /works/{workSlug}/chapters:
    post:
      operationId: createChapter
      summary: Добавить главу
      tags: [Chapters]
      security:
        - bearerAuth:
            - ADMIN
      parameters:
        - name: workSlug
          in: path
          required: true
          description: Slug произведения
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'sangraha-schemas.yaml#/CreateChapterRequest'
      responses:
        '201':
          description: Глава создана
          content:
            application/json:
              schema:
                $ref: 'sangraha-schemas.yaml#/ChapterSummary'

  /chapters/{chapterId}:
    put:
      operationId: updateChapter
      summary: Обновить главу
      tags: [Chapters]
      security:
        - bearerAuth:
            - ADMIN
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'sangraha-schemas.yaml#/UpdateChapterRequest'
      responses:
        '200':
          description: Глава обновлена
          content:
            application/json:
              schema:
                $ref: 'sangraha-schemas.yaml#/ChapterSummary'
    delete:
      operationId: deleteChapter
      summary: Soft delete главы
      tags: [Chapters]
      security:
        - bearerAuth:
            - ADMIN
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Глава помечена как удалённая

  /chapters/{chapterId}/verses:
    post:
      operationId: createVerse
      summary: Добавить стих (пустой, DRAFT)
      tags: [Verses]
      security:
        - bearerAuth:
            - ADMIN
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Стих создан
          content:
            application/json:
              schema:
                $ref: 'sangraha-schemas.yaml#/VerseSummary'

  /verses/{verseId}:
    get:
      operationId: getVerse
      summary: Получить стих (текст + анализ, если ANALYZED)
      tags: [Verses]
      security:
        - bearerAuth: []
      parameters:
        - name: verseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Детали стиха
          content:
            application/json:
              schema:
                $ref: 'sangraha-schemas.yaml#/VerseDetail'
        '404':
          description: Стих не найден
    delete:
      operationId: deleteVerse
      summary: Soft delete стиха
      tags: [Verses]
      security:
        - bearerAuth:
            - ADMIN
      parameters:
        - name: verseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Стих помечен как удалённый

  /verses/{verseId}/vocabulary-quiz:
    post:
      operationId: getOrCreateVocabularyQuiz
      summary: Получить (или создать) лексический квиз этого стиха — кнопка «Изучить»
      description: |
        Если `verses.vocabulary_quiz_slug` уже заполнен — возвращает его немедленно,
        без обращения к content-service. Иначе собирает уникальные слова стиха
        (VerseWord[], дедуп по lemmaIast+stem) и синхронно вызывает
        content-service `POST /content/internal/sangraha/vocabulary-quiz`
        (см. content-service.md §11), сохраняет полученный `quizSlug` в
        `verses.vocabulary_quiz_slug` и возвращает его. См. sangraha-service.md
        §6/§7, ADR-009 (заменяет прежний Outbox-механизм — синхронизация теперь
        по клику пользователя, а не автоматически после анализа).
      tags: [Verses]
      security:
        - bearerAuth: []
      parameters:
        - name: verseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Слог лексического квиза (существующий или только что созданный)
          content:
            application/json:
              schema:
                type: object
                required: [quizSlug]
                properties:
                  quizSlug:
                    type: string
        '404':
          description: Стих не найден
        '409':
          description: Стих ещё не проанализирован (status != ANALYZED) либо не содержит слов

  /verses/{verseId}/analyze:
    post:
      operationId: analyzeVerse
      summary: Сохранить raw_text и запустить LLM-анализ стиха
      description: |
        Единственная точка сохранения текста стиха (кнопка «Сохранить» удалена
        из фронтенда, см. sangraha-service.md §5.1, §7). Тело обязательно —
        `UpdateVerseTextRequest` (поле `text`). Backend в рамках запроса:
        сохраняет `text` в `Verse.rawText`, определяет письменность и заполняет
        textDevanagari/textIast, затем переводит статус в ANALYZING и
        возвращает 202 — анализ асинхронный, статус опрашивается через
        GET /verses/{verseId}.
      tags: [Verses]
      security:
        - bearerAuth:
            - ADMIN
      parameters:
        - name: verseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'sangraha-schemas.yaml#/UpdateVerseTextRequest'
      responses:
        '202':
          description: raw_text сохранён, анализ запущен
          content:
            application/json:
              schema:
                type: object
                properties:
                  verseId:
                    type: string
                    format: uuid
                  status:
                    type: string
                    example: ANALYZING
        '404':
          description: Стих не найден
        '409':
          description: Стих уже анализируется (status = ANALYZING)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT