openapi: "3.1.0"
info:
  title: Sangraha Service API
  description: |
    API для чтения санскритских произведений (Work → Chapter → Verse) и LLM-анализа стихов.
    Work/Chapter CRUD удалён — произведения и главы управляются через импорт.
    Verse CRUD удалён — стихи создаются через импорт, текст сохраняется через POST …/analyze.

    Все write-эндпоинты требуют роль ADMIN.
  version: "1.0.0"
  contact:
    name: Samskrtam Team

servers:
  - url: /api/v1/sangraha
    description: Через API Gateway (prefix /api/v1/sangraha)

paths:
  /works:
    get:
      operationId: listWorks
      summary: Плитки произведений с опциональным фильтром по классификатору
      tags: [Works]
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: query
          required: false
          description: |
            Повторяющийся параметр — фильтрация по категориям классификатора
            (множественный выбор). Произведение подходит, если связано хотя бы
            с одной категорией из запроса, включая все её подкатегории
            (рекурсивно). Без параметра — все произведения.
          schema:
            type: array
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: Список произведений
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'schemas/sangraha-schemas.yaml#/WorkSummary'

  /works/classes:
    get:
      operationId: listWorksClasses
      summary: Дерево классификатора произведений (для дропдаунов с множественным выбором)
      description: |
        Категории сгруппированы по значению classification (GENRE, ERA, …) —
        одна группа = один TreeSelect на фронтенде.
      tags: [Works]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Дерево классификатора
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'schemas/sangraha-schemas.yaml#/WorksClassGroup'

  /works/{workSlug}:
    get:
      operationId: getWorkTreeBySlug
      summary: Произведение + список глав (без стихов) по slug
      description: |
        Основной эндпоинт для страницы произведения (фронтенд: /sangraha/{workSlug}).
        Возвращает id, slug, titleRu/En и chapters[] с краткой информацией о главах
        (ChapterSummary — без verses, только verseCount). Стихи загружаются отдельно
        через GET /chapters/{chapterId}/verses.
      tags: [Works]
      security:
        - bearerAuth: []
      parameters:
        - name: workSlug
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-z0-9][a-z0-9-]*$'
      responses:
        '200':
          description: Произведение со списком глав (без стихов)
          content:
            application/json:
              schema:
                $ref: 'schemas/sangraha-schemas.yaml#/WorkTree'
        '404':
          description: Произведение не найдено

  # ── Chapters: single chapter with its verses (NEW) ──

  /chapters/{chapterId}/verses:
    get:
      operationId: getChapterVerses
      summary: Одна глава со списком стихов
      description: |
        Возвращает главу и полный список её стихов (VersePreview[]).
        Фронтенд: страница /sangraha/{workSlug}/chapters/{chapterId}.
      tags: [Chapters]
      security:
        - bearerAuth: []
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Глава со списком стихов
          content:
            application/json:
              schema:
                $ref: 'schemas/sangraha-schemas.yaml#/ChapterWithVerses'
        '404':
          description: Глава не найдена

  /chapters/{chapterId}/verses/analyze-all:
    post:
      operationId: analyzeAllVerses
      summary: Запустить пакетный LLM-анализ всех стихов главы — кнопка «Анализировать всё»
      description: |
        Переводит все стихи главы со статусом DRAFT/FAILED в ANALYZING и запускает
        один batch-вызов LLM (`submit_verse_analyses`, см.
        sangraha-prompts/verse-analysis.md) на все эти стихи сразу. Результаты
        сопоставляются со стихами по verseIndex и сохраняются по одному, той же
        транзакцией на стих, что и одиночный анализ (см. sangraha-service.md §5.4).
        Стихи уже в статусе ANALYZING/ANALYZED пропускаются.
      tags: [Chapters]
      security:
        - bearerAuth:
            - ADMIN
      parameters:
        - name: chapterId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '202':
          description: Пакетный анализ запущен
          content:
            application/json:
              schema:
                $ref: 'schemas/sangraha-schemas.yaml#/AnalyzeAllVersesResponse'
        '404':
          description: Глава не найдена
        '409':
          description: В главе нет стихов, доступных для анализа

  # ── Verses (read-only + study + raw analysis/words) ──

  /verse:
    post:
      operationId: getVersesByIds
      summary: Стихи по произвольному списку id (для массового просмотра/ревью)
      description: |
        Чтение без ограничения размера списка id (в отличие от анализа — размер
        на этой ручке не важен). Не найденные/удалённые id просто отсутствуют
        в verses[] — без ошибки. В отличие от внутреннего /sangraha/internal/content/
        verses/batch отдаёт status (DRAFT|ANALYZING|ANALYZED|FAILED) каждого стиха.
        Фронтенд: страница /sangraha/verses, см. sangraha-service/batch-verse-review.md.
      tags: [Verses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/sangraha-schemas.yaml#/VersesBatchRequest'
      responses:
        '200':
          description: Стихи по порядку id в запросе
          content:
            application/json:
              schema:
                $ref: 'schemas/sangraha-schemas.yaml#/VersesBatchResponse'

  /verse/analysis:
    post:
      operationId: analyzeVerses
      summary: Батч-анализ произвольного списка стихов (безусловный повтор)
      description: |
        Анализирует все переданные verseId независимо от текущего status — включая
        уже ANALYZED (полная перезапись существующего VerseAnalysis/VerseWord[]).
        В отличие от analyze-all — фильтрации по DRAFT/FAILED нет. Входной список
        разбивается на чанки, обрабатываются последовательно синхронно.
        Не найденные/удалённые id исключаются молча. См.
        sangraha-service/batch-verse-review.md.
      tags: [Verses]
      security:
        - bearerAuth:
            - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/sangraha-schemas.yaml#/AnalyzeVersesRequest'
      responses:
        '202':
          description: Анализ запущен
          content:
            application/json:
              schema:
                $ref: 'schemas/sangraha-schemas.yaml#/AnalyzeVersesResponse'

  /words/examples:
    post:
      operationId: getWordExamples
      summary: Пример стиха по точной словоформе (колонка урока склонений)
      description: |
        Для каждой запрошенной surfaceIast возвращает ровно один стих — самый
        короткий (3–7 слов), содержащий глагол. Перевод (translationRu/En) может
        отсутствовать — стих тогда отдаётся без перевода. Форма без подходящего
        стиха получает пустой verses.
      tags: [Verses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/sangraha-schemas.yaml#/VerseWordExamplesRequest'
      responses:
        '200':
          description: Стихи-примеры по каждой форме
          content:
            application/json:
              schema:
                $ref: 'schemas/sangraha-schemas.yaml#/VerseWordExamplesResponse'

  /verses/examples:
    post:
      operationId: getDeclensionExamples
      summary: Примеры склонений по словоизменительному классу (вкладка урока склонений)
      description: |
        Один запрос на всю парадигму склонения: для каждой ячейки
        (caseType, numberType) ищутся реальные цитаты из проанализированных стихов,
        результат группируется по (caseType, numberType) с текстом/переводом стихов.
        gender/caseType/numberType в запросе опциональны: не заполнены — фильтр
        по соответствующей оси не применяется (стихи с любым родом/падежом/числом). Фронтенд делает один такой
        запрос на урок и рендерит вкладку «Примеры».
        См. docs/services/sangraha-service.md §9.
      tags: [Verses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/sangraha-schemas.yaml#/DeclensionExamplesRequest'
      responses:
        '200':
          description: Сгруппированные по ячейке парадигмы примеры с текстом стихов
          content:
            application/json:
              schema:
                $ref: 'schemas/sangraha-schemas.yaml#/DeclensionExamplesResponse'
        '400':
          description: vowelType не передан или limitPerGroup < 1

  /verses/{verseId}:
    get:
      operationId: getVerse
      summary: Получить стих (текст + анализ, если ANALYZED)
      tags: [Verses]
      security:
        - bearerAuth: []
      parameters:
        - name: verseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Детали стиха
          content:
            application/json:
              schema:
                $ref: 'schemas/sangraha-schemas.yaml#/VerseDetail'
        '404':
          description: Стих не найден

  /verses/{verseId}/study:
    post:
      operationId: studyVerse
      summary: Кнопка «Изучить» — экспорт лемм стиха и возврат кода VERSE-урока
      description: |
        On-demand экспорт пачки лемм стиха в curriculum-service (см.
        VerseBatchPushService / lexicon-content-pipeline.md §7) и возврат кода
        VERSE-урока, на который ведёт кнопка «Изучить». Идемпотентен — повторный
        вызов не создаёт дублей при импорте.
        Код урока: для стиха в главе — «{workSlp1}_{chapterNumber}», для
        standalone-стиха (без главы) — персональный «user-{ownerId}».
      tags: [Verses]
      security:
        - bearerAuth: []
      parameters:
        - name: verseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Код VERSE-урока, на который ведёт кнопка «Изучить»
          content:
            application/json:
              schema:
                type: object
                required: [verseTopicCode]
                properties:
                  verseTopicCode:
                    type: string
        '404':
          description: Стих не найден
        '409':
          description: Стих ещё не проанализирован (status != ANALYZED) либо код урока не резолвится

  /verses/{verseId}/analysis:
    get:
      operationId: getVerseAnalysis
      summary: Сырой VerseAnalysis стиха (сущность, без маппинга в DTO)
      description: |
        Возвращает запись verse_analyses напрямую (без VerseAnalysisDto).
        sandhiSplits/rawModelResponse/rawPrompt хранятся текстом и отдаются
        как есть (сырой JSON/промпт). Основной читающий путь фронтенда —
        GET /verses/{verseId} (вложенный analysis в VerseDetail), этот эндпоинт
        служит для отладки/выгрузки.
      tags: [Verses]
      security:
        - bearerAuth: []
      parameters:
        - name: verseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Сырой анализ стиха
          content:
            application/json:
              schema:
                $ref: 'schemas/sangraha-schemas.yaml#/VerseAnalysis'
        '404':
          description: Анализ стиха не найден

  /verses/{verseId}/words:
    get:
      operationId: getVerseWords
      summary: VerseWord[] стиха (сущности, без маппинга в DTO)
      description: |
        Возвращает словоформы стиха (verse_words) напрямую как сущности.
        Основной читающий путь фронтенда — GET /verses/{verseId} (вложенные
        words в VerseDetail), этот эндпоинт служит для отладки/выгрузки.
      tags: [Verses]
      security:
        - bearerAuth: []
      parameters:
        - name: verseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Словоформы стиха по порядку позиции
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'schemas/sangraha-schemas.yaml#/VerseWord'

  /verses/{verseId}/analyze:
    post:
      operationId: analyzeVerse
      summary: Сохранить текст и запустить LLM-анализ стиха
      description: |
        Единственная точка сохранения текста стиха (Verse CRUD удалён).
        Тело `VerseTextRequest` опционально: пустое тело — анализ по уже
        сохранённому raw_text (повторный запуск). Ответ всегда 202 без тела.
      tags: [Verses]
      security:
        - bearerAuth:
            - ADMIN
      parameters:
        - name: verseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'schemas/sangraha-schemas.yaml#/VerseTextRequest'
      responses:
        '202':
          description: raw_text сохранён (если передан), анализ запущен; без тела
        '404':
          description: Стих не найден
        '409':
          description: Стих уже анализируется (status = ANALYZING)

  /analysis:
    post:
      operationId: createStandaloneAnalysis
      summary: Создать standalone-стих и запустить LLM-анализ (страница /analysis)
      description: |
        Создаёт новую запись в `verses` с `chapter_id = null` и `owner_id` текущего
        пользователя (стих не привязан к произведению/главе) и сразу запускает
        анализ. Каждое нажатие «Анализировать» на странице /analysis создаёт новую
        запись. Доступ — любой авторизованный, стихи персональные. Тело
        `VerseTextRequest` опционально (пустое тело — создаётся пустой стих).
      tags: [Analysis]
      security:
        - bearerAuth: []
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: Владелец standalone-стиха (ставится api-gateway из JWT)
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: 'schemas/sangraha-schemas.yaml#/VerseTextRequest'
      responses:
        '200':
          description: Созданный стих (детали, статус ANALYZING сразу после запуска анализа)
          content:
            application/json:
              schema:
                $ref: 'schemas/sangraha-schemas.yaml#/VerseDetail'
        '400':
          description: Некорректный/пустой текст после разбора
    get:
      operationId: listStandaloneAnalysis
      summary: Список standalone-стихов текущего пользователя
      description: |
        Standalone-стихи пользователя (chapter_id = null), новые сверху, без
        контекста произведения/главы — только превью, статус и дата создания.
      tags: [Analysis]
      security:
        - bearerAuth: []
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: Владелец standalone-стихов (ставится api-gateway из JWT)
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Список разборов пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: 'schemas/sangraha-schemas.yaml#/StandaloneVerseItem'

  /analysis/{verseId}:
    delete:
      operationId: deleteStandaloneAnalysis
      summary: Удалить standalone-стих (только владелец)
      tags: [Analysis]
      security:
        - bearerAuth: []
      parameters:
        - name: verseId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-User-Id
          in: header
          required: true
          description: Владелец standalone-стиха (ставится api-gateway из JWT)
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Мягко удалён
        '400':
          description: Стих не standalone либо не принадлежит пользователю
        '404':
          description: Стих не найден

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
