openapi: "3.1.0"
info:
  title: sangraha-service — Internal API (строительные блоки агрегации)
  description: |
    Internal-эндпоинты (не через api-gateway): батч-выдача текста/перевода стихов,
    экспорт корпуса VerseWord и кандидаты на импорт существительных.
    Используются curriculum-service и как строительный блок публичного
    POST /api/v1/sangraha/verses/examples (агрегация происходит в JVM:
    VerseWordSearchService.searchExamples).
    Источник истины — docs/services/sangraha-service.md §9.
  version: "1.0.0"

servers:
  - url: http://sangraha-service:8082
    description: Прямой service-to-service вызов, минуя api-gateway

paths:
  /sangraha/internal/content/verse-words/export:
    get:
      operationId: exportVerseWords
      summary: Экспорт корпуса VerseWord для batch-импорта лексики
      tags: [verse-word-export]
      description: >
        Курсорная постраничная выгрузка словоформ корпуса (после
        GET /sangraha/internal/lexicon/lemmas/export включает lemma_iast и stem
        для связывания с леммами). Вызывается curriculum-service
        (lexicon-content-pipeline.md §2). Сортировка и курсор — по verseId
        (одна страница = одно слово одного стиха).
      parameters:
        - name: cursor
          in: query
          required: false
          description: Последний verseId из предыдущей страницы; null/отсутствует — первая страница
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Размер страницы (clamp 1..500, default 500)
          schema:
            type: integer
            default: 500
      responses:
        '200':
          description: Страница словоформ
          content:
            application/json:
              schema:
                $ref: 'schemas/internal-content-schemas.yaml#/VerseWordExportPageDto'

  /sangraha/internal/content/verses/batch:
    post:
      operationId: getVersesBatch
      summary: Batch-fetch verse text/translation/attribution by verseId list
      tags: [declension-examples]
      description: >
        Только status=ANALYZED. verseId, для которого стиха нет / не ANALYZED / мягко
        удалён — молча отсутствует в ответе, без ошибки (потребитель не различает
        причину, см. sangraha-service.md §9).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: 'schemas/internal-content-schemas.yaml#/VersesBatchRequestDto'
      responses:
        '200':
          description: Только найденные и проанализированные стихи, в произвольном порядке
          content:
            application/json:
              schema:
                $ref: 'schemas/internal-content-schemas.yaml#/VersesBatchResponseDto'
        '400':
          description: Invalid payload
          content:
            application/json:
              schema:
                $ref: '../common/schemas/common.yaml#/ErrorResponse'

  /sangraha/internal/content/nominal-lemmas:
    get:
      operationId: fetchNominalLemmaCandidates
      summary: Кандидаты на импорт существительных (бутстрап склонений)
      tags: [nominal-lemmas]
      description: >
        Список существительных из nominal_lemmas (объединение с verse_words по
        lemma_iast для частотности), кандидаты на импорт в curriculum-лексикон
        для бутстрапа квизов/парадигм склонений. Вызывается curriculum-service
        (SangrahaClient). Род — самый частый по лемме из verse_word_morphology
        (может быть null).
      parameters:
        - name: stemClass
          in: query
          required: false
          description: Фильтр по классу основы (A_STEM … R_STEM); не задан — все классы
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Максимум кандидатов (default 100)
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: Кандидаты, отсортированные по частоте вхождения убыванию
          content:
            application/json:
              schema:
                $ref: 'schemas/internal-content-schemas.yaml#/NominalLemmaCandidatesResponseDto'
