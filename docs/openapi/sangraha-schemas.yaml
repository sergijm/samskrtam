# Схемы sangraha-service
# Импортируются из sangraha-service.yaml через $ref: 'sangraha-schemas.yaml#/WorkSummary'

WorkSummary:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    titleRu:
      type: string
    titleEn:
      type: string
    titleSaIast:
      type: string
    titleSaDevanagari:
      type: string
      nullable: true
    descriptionRu:
      type: string
      nullable: true
    descriptionEn:
      type: string
      nullable: true
    author:
      type: string
      nullable: true

WorkTree:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    titleRu:
      type: string
    titleEn:
      type: string
    titleSaIast:
      type: string
    titleSaDevanagari:
      type: string
      nullable: true
    chapters:
      type: array
      items:
        $ref: '#/ChapterWithVerses'

ChapterWithVerses:
  type: object
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    orderIndex:
      type: integer
    titleRu:
      type: string
    titleEn:
      type: string
    categoryCode:
      type: string
      description: "{workSlug}.{chapterSlug} — код категории лексики"
    verses:
      type: array
      items:
        $ref: '#/VersePreview'

VersePreview:
  type: object
  properties:
    id:
      type: string
      format: uuid
    orderIndex:
      type: integer
    textIastPreview:
      type: string
      description: Первые ~50 символов textIast для отображения в дереве
      nullable: true
    status:
      $ref: '#/VerseStatus'

VerseSummary:
  type: object
  properties:
    id:
      type: string
      format: uuid
    chapterId:
      type: string
      format: uuid
    orderIndex:
      type: integer
    status:
      $ref: '#/VerseStatus'

VerseDetail:
  type: object
  description: |
    Контракт nullable-полей analysis и words:
    - analysis === null ДОПУСТИМО ТОЛЬКО если status != ANALYZED.
    - Если status == ANALYZED, analysis ОБЯЗАТЕЛЕН (не null).
    - words: аналогично — null только при status != ANALYZED.
    Фронтенд (см. §7) должен показывать явный плейсхолдер/ошибку,
    если status == ANALYZED, но analysis/words пришли как null.
  properties:
    id:
      type: string
      format: uuid
    chapterId:
      type: string
      format: uuid
    orderIndex:
      type: integer
    textDevanagari:
      type: string
      nullable: true
    textIast:
      type: string
      nullable: true
    status:
      $ref: '#/VerseStatus'
    analysis:
      $ref: '#/VerseAnalysisDto'
      nullable: true
    words:
      type: array
      items:
        $ref: '#/VerseWordDto'
      nullable: true

VerseAnalysisDto:
  type: object
  properties:
    translationRu:
      type: string
    translationEn:
      type: string
    sandhiSplits:
      type: array
      items:
        type: object
        properties:
          surface:
            type: string
          components:
            type: array
            items:
              type: string
    modelName:
      type: string
    analyzedAt:
      type: string
      format: date-time

VerseWordDto:
  type: object
  properties:
    id:
      type: string
      format: uuid
    position:
      type: integer
    surfaceIast:
      type: string
    surfaceDevanagari:
      type: string
    lemmaIast:
      type: string
    stem:
      type: string
    root:
      type: string
      nullable: true
    pos:
      type: string
      nullable: true
    gender:
      type: string
      nullable: true
    caseType:
      type: string
      nullable: true
    numberType:
      type: string
      nullable: true
    person:
      type: string
      nullable: true
    tense:
      type: string
      nullable: true
    mood:
      type: string
      nullable: true
    voice:
      type: string
      nullable: true
    glossRu:
      type: string
    glossEn:
      type: string

VerseStatus:
  type: string
  enum: [DRAFT, ANALYZING, ANALYZED, FAILED]

CreateWorkRequest:
  type: object
  required: [title]
  properties:
    title:
      type: string
      description: |
        Сырой ввод пользователя на любом из трёх языков (деванагари, кириллица, латиница).
        Backend сам детектит язык (см. sangraha-service.md §5.2) и через LLM
        генерирует остальные поля. Slug вычисляется из titleSaIast через SLP1.
    description:
      type: string
      description: |
        Опциональное описание на языке, которым пользователь ввёл title.
        Если указано — считается описанием на detectedLanguage; модель дополняет
        второй перевод. Санскритское описание не хранится.

UpdateWorkRequest:
  type: object
  properties:
    titleRu:
      type: string
    titleEn:
      type: string
    descriptionRu:
      type: string
    descriptionEn:
      type: string
    author:
      type: string

CreateChapterRequest:
  type: object
  required: [slug, titleRu, titleEn]
  properties:
    slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]*$'
    orderIndex:
      type: integer
    titleRu:
      type: string
    titleEn:
      type: string

UpdateChapterRequest:
  type: object
  properties:
    slug:
      type: string
      pattern: '^[a-z0-9][a-z0-9-]*$'
    orderIndex:
      type: integer
    titleRu:
      type: string
    titleEn:
      type: string

UpdateVerseTextRequest:
  type: object
  required: [text]
  properties:
    text:
      type: string
      description: |
        Единое поле ввода. Backend определяет письменность по Unicode-диапазону:
        символы деванагари → textDevanagari, иначе → textIast.
        Отсутствующее представление достраивает LLM при анализе (§5.1).

ChapterSummary:
  type: object
  properties:
    id:
      type: string
      format: uuid
    workId:
      type: string
      format: uuid
    slug:
      type: string
    orderIndex:
      type: integer
    titleRu:
      type: string
    titleEn:
      type: string