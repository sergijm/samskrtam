# Shared parameters for lesson API endpoints
# Referenced via $ref: '../openapi/parameters.yaml#/SlugParam'

SlugParam:
  name: slug
  in: path
  required: true
  description: Уникальный slug словарного квиза (например "animals", "1")
  schema:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'
    example: animals

QuizTypeParam:
  name: type
  in: path
  required: true
  description: Тип грамматического квиза (DECLENSIONS, CONJUGATIONS)
  schema:
    type: string
    enum: [DECLENSIONS, CONJUGATIONS]
    example: DECLENSIONS

PageParam:
  name: page
  in: query
  required: false
  schema:
    type: integer
    minimum: 0
    default: 0

SizeParam:
  name: size
  in: query
  required: false
  schema:
    type: integer
    minimum: 1
    maximum: 50
    default: 10