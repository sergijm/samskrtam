# Пути из lesson-aggregation-openapi.yaml → lesson-paths/content.yaml
paths:
  /lessons/{slug}/declension-paradigms:
    get:
      tags: [lesson-v2]
      summary: Парадигмы склонения урока (v2, карусель)
      description: >
        Возвращает ровно одну парадигму (основа + все формы) по 0-индексу `index`
        плюс метаданные карусели (index, totalCount) для отображения "N / total".
      operationId: getDeclensionParadigmsV2
      parameters:
        - $ref: '../common/parameters.yaml#/SlugParam'
        - name: index
          in: query
          required: false
          description: 0-based позиция парадигмы в отсортированном списке основ
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Парадигма и метаданные карусели
          content:
            application/json:
              schema:
                $ref: '../common/schemas/declension-paradigm.yaml#/DeclensionParadigmPageDto'
        '404':
          $ref: '../lesson-aggregation-openapi.yaml#/components/responses/NotFound'
        '401':
          $ref: '../lesson-aggregation-openapi.yaml#/components/responses/Unauthorized'

# Components

