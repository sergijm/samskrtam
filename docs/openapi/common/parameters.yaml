# Shared parameters for Quiz Sessions API

SlugParam:

  name: slug

  in: path

  required: true

  description: Slug of the quiz lesson (e.g. "declensions", "vocabulary")

  schema:

    type: string

    example: declensions


SessionIdParam:

  name: sessionId

  in: path

  required: true

  description: UUID of the quiz session

  schema:

    type: string

    format: uuid


LessonIdParam:

  name: lessonId

  in: query

  required: false

  description: UUID of the lesson (optional; topic-based sessions use topicCode instead)

  schema:

    type: string

    format: uuid


PageParam:

  name: page

  in: query

  required: false

  description: Page number (0-based)

  schema:

    type: integer

    default: 0

    minimum: 0


SizeParam:

  name: size

  in: query

  required: false

  description: Page size

  schema:

    type: integer

    default: 10

    minimum: 1


LocaleParam:

  name: locale

  in: query

  required: false

  description: User locale for localized text (e.g. "en", "ru")

  schema:

    type: string

    default: en


XUserIdHeader:

  name: X-User-Id

  in: header

  required: true

  description: User ID (set by API Gateway)

  schema:

    type: string

    format: uuid


XUserLocaleHeader:

  name: X-User-Locale

  in: header

  required: true

  description: User locale (e.g. "ru", "en")

  schema:

    type: string

    example: ru


ProgressTagSetIdParam:

  name: progressTagSetId

  in: query

  required: false

  description: >
    Stable id of a named progress-tag set used to start/resume a session scoped to a
    subset of a lesson's progress (see quest-engine.md §2.4, quiz-generator-spec.md §3/§4).
    NEW - tags without a quiz_item_score row. LEARNING - started tags not yet mastered.
    MASTERED - tags at or above masteredLowerThreshold (DUE detail selection happens
    inside this set). DIFFICULT - orthogonal set (consecutiveMistakes >= 2 or score <=
    difficultUpperThreshold), with hysteresis on exit. Declension lessons add
    SINGULAR/DUAL/PLURAL (by number) and case pairs ACC_LOC/INS_ABL/GEN_LOC/DAT_ACC.
    Used by the LessonStatsBadges/LessonStatsTab components and GrammarProgressGrid
    headers to start/resume a session over one named set. Resume is matched by the
    equality of progressTagSetId stored on the IN_PROGRESS session.

  schema:

    type: string

    enum: [NEW, LEARNING, MASTERED, DIFFICULT, SINGULAR, DUAL, PLURAL, ACC_LOC, INS_ABL, GEN_LOC, DAT_ACC]