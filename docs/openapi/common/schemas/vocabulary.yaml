# Vocabulary lesson schemas

WordStatus:
  type: string
  enum: [NEW, LEARNING, MASTERED]
  description: >
    Вычисляемое поле ответа API, не хранится в БД. Определяется по правилам ADR-007
    (обновление 2026-07, единый порог для VOCABULARY_WORD и DECLENSION_FORM):
    нет строки в quiz_item_score → NEW; score < 90 → LEARNING; score >= 90 → MASTERED.
    DUE (nextReviewAt <= now) — внутренний атрибут отбора внутри сета MASTERED, статусом
    не показывается (см. quest-engine.md §2.4). DIFFICULT (consecutiveMistakes >= 2
    или score <= difficultUpperThreshold) — ортогональная ось, независимая от этого
    поля; учитывается в LessonStatusSummary.difficult (см. lessons.yaml).

VocabularyWordProgress:
  type: object
  required: [wordId, word, translationRu, translationEn, nSuccess, nAll, score, status]
  properties:
    wordId:
      type: string
      format: uuid
    word:
      type: string
      description: Слово в IAST транслитерации
      example: mṛga
    wordDevanagari:
      type:
        - string
        - 'null'
    translationRu:
      type: string
    translationEn:
      type: string
    nSuccess:
      type: integer
      minimum: 0
    nAll:
      type: integer
      minimum: 0
    score:
      type: integer
      minimum: 0
      maximum: 100
      description: Экспоненциальный счёт (0-100), вычисляется по формуле из спецификации §2.5 ScoreCalculator. Источник — quiz_item_score.score.
    status:
      $ref: './vocabulary.yaml#/WordStatus'

VocabularyLesson:
  type: object
  required: [lessonId, slug, titleRu, titleEn, difficulty, totalWords, learnedWords, progressPercent, statusSummary, words]
  properties:
    lessonId:
      type: string
      format: uuid
    slug:
      type: string
    titleRu:
      type: string
    titleEn:
      type: string
    difficulty:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    totalWords:
      type: integer
      minimum: 1
    learnedWords:
      type: integer
      minimum: 0
      description: score >= 90 (masteredLowerThreshold). См. также statusSummary.mastered.
    progressPercent:
      type: number
      format: float
      minimum: 0
      maximum: 100
    statusSummary:
      $ref: './lessons.yaml#/LessonStatusSummary'
    words:
      type: array
      items:
        $ref: './vocabulary.yaml#/VocabularyWordProgress'