# Grammar lesson schemas

GrammarQuestionProgress:
  type: object
  required:
    - questionId
    - textRu
    - textEn
    - score
    - status
    - caseType
    - caseRu
    - caseEn
    - caseEnding
    - numberType
    - numberRu
    - numberEn
    - gender
    - genderRu
    - genderEn
  properties:
    questionId:
      type: string
      format: uuid
    textRu:
      type: string
    textEn:
      type: string
    correctAnswerRu:
      type: string
      deprecated: true
      description: Заменено на caseEnding. Оставлено для обратной совместимости.
    correctAnswerEn:
      type: string
      deprecated: true
      description: Заменено на caseEnding. Оставлено для обратной совместимости.
    nSuccess:
      type: integer
      minimum: 0
      deprecated: true
      description: Вычисляется на стороне сервера, больше не требуется.
    nAll:
      type: integer
      minimum: 0
      deprecated: true
      description: Вычисляется на стороне сервера, больше не требуется.
    score:
      type: integer
      minimum: 0
      maximum: 100
      description: Экспоненциальный счёт (0-100), вычисляется по формуле из спецификации §2.5 ScoreCalculator. Источник — quiz_item_score.score.
    status:
      allOf:
        - $ref: './vocabulary.yaml#/WordStatus'
      description: >
        Вычисляемое поле ответа API, не хранится в БД. Определяется по правилам ADR-007
        (единый порог 90 для DECLENSION_FORM и VOCABULARY_WORD).
        Использует ту же схему WordStatus, что и лексические уроки.
        Не путать с полем БД — БД хранит только score, статус вычисляется лениво.
    caseEnding:
      type: string
      description: Эталонное окончание для данного вопроса (caseType + numberType + gender). В IAST.
      example: 'aḥ'
    caseType:
      type: string
      example: NOMINATIVE
    caseRu:
      type: string
      example: Именительный
    caseEn:
      type: string
      example: Nominative
    numberType:
      type: string
      example: SINGULAR
    numberRu:
      type: string
      example: Единственное
    numberEn:
      type: string
      example: Singular
    gender:
      type: string
      description: Грамматический род. Для уроков с двумя родами (declensions-i, declensions-u, declensions-r) значение 'UNSPECIFIED'.
      example: MASCULINE
    genderRu:
      type: string
      example: Мужской
    genderEn:
      type: string
      example: Masculine

GrammarLesson:
  type: object
  required: [lessonId, type, titleRu, titleEn, difficulty, totalQuestions, learnedQuestions, progressPercent, statusSummary, questions]
  properties:
    lessonId:
      type: string
      format: uuid
    type:
      type: string
      enum: [DECLENSIONS, CONJUGATIONS]
    titleRu:
      type: string
    titleEn:
      type: string
    difficulty:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    totalQuestions:
      type: integer
      minimum: 1
    learnedQuestions:
      type: integer
      minimum: 0
      description: score >= 90 (masteredLowerThreshold). См. также statusSummary.mastered.
    progressPercent:
      type: number
      format: float
      minimum: 0
      maximum: 100
    statusSummary:
      $ref: './lessons.yaml#/LessonStatusSummary'
    questions:
      type: array
      items:
        $ref: './grammar.yaml#/GrammarQuestionProgress'