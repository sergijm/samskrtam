# Lesson listing schemas

LessonType:
  type: string
  enum: [VOCABULARY, VOCABULARY_BASIC, VOCABULARY_TEXTS, DECLENSIONS, CONJUGATIONS]

LessonStatusSummary:
  type: object
  description: >
    Сводка по статусам QuizItem урока для текущего пользователя (LessonPage).
    Считается на бэкенде из quiz.quiz_item_score (ADR-007), не на фронтенде.
  required: [total, newCount, learning, mastered, difficult]
  properties:
    total:
      type: integer
      minimum: 0
      description: Количество QuizItem урока всего.
    newCount:
      type: integer
      minimum: 0
      description: Нет строки в quiz_item_score — обучение не начато. Кнопка "Изучить".
    learning:
      type: integer
      minimum: 0
      description: Есть строка, score < masteredLowerThreshold (90). Кнопка "Продолжить".
    mastered:
      type: integer
      minimum: 0
      description: >
        score >= masteredLowerThreshold (90). Кнопка "Повторить" (сет MASTERED;
        отбор деталей внутри сета — по DUE, см. quest-engine.md §2.4).
    difficult:
      type: integer
      minimum: 0
      description: >
        Ортогональная ось, независимая от статуса: строка есть и (consecutiveMistakes >= 2
        ИЛИ score <= difficultUpperThreshold). Входит в total, пересекается с learning/mastered
        (см. quest-engine.md §2.4).

LessonItemDto:
  type: object
  required: [id, slug, titleRu, titleEn, descriptionRu, descriptionEn, lessonType, difficulty, totalQuestions, totalWordsOwn, learnedWords]
  properties:
    id:
      type: string
      format: uuid
    slug:
      type: string
    titleRu:
      type: string
    titleEn:
      type: string
    descriptionRu:
      type: string
    descriptionEn:
      type: string
    lessonType:
      $ref: './lessons.yaml#/LessonType'
    difficulty:
      type: string
      enum: [BEGINNER, INTERMEDIATE, ADVANCED]
    totalQuestions:
      type: integer
    totalWordsOwn:
      type: integer
    learnedWords:
      type: integer
      description: >
        Количество QuizItem урока со score >= masteredLowerThreshold (90) в
        quiz.quiz_item_score. 100% на плитке урока соответствует
        learnedWords == totalWordsOwn, т.е. все QuizItem урока в статусе MASTERED.

LessonListResponse:
  type: object
  required: [lessons]
  properties:
    lessons:
      type: array
      items:
        $ref: './lessons.yaml#/LessonItemDto'