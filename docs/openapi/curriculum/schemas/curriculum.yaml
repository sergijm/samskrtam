# Schemas for curriculum-service API v2

PrerequisiteStrength:
  type: string
  enum: [RECOMMENDED, HELPFUL]
  description: Soft dependency strength — never blocks access to a topic, only drives UI hints.

LearningLevel:
  type: string
  enum: [L0, L1, L2, L3, L4, L5, L6]
  description: Authored first-introduction level. Independent from the prerequisite DAG — not derived, not a computed graph layer (see curriculum-service.md §2/§6).

TopicDto:
  required: [id, code, titleRu, titleEn, learningLevel, isEvergreen, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
      example: a-stem-masculine
      description: Stable slug, unique, used as an external reference by other services/frontend.
    titleRu:
      type: string
      example: "a-основа: masculine"
    titleEn:
      type: string
      example: "a-stem: masculine"
    learningLevel:
      $ref: '#/LearningLevel'
    isEvergreen:
      type: boolean
      description: True for topics available always, outside the layered graph (Mixed review, Error correction).
    displayOrder:
      type: integer
      nullable: true
      description: Manual tie-break order within the same learningLevel.
    appearsInLevels:
      type: array
      nullable: true
      items:
        $ref: '#/LearningLevel'
      description: >
        Derived, read-only. The topic's own learningLevel. In earlier
        iterations this was a join with ComplexQuiz to detect additional
        practice levels; ComplexQuiz has been removed.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

TopicPrerequisiteDto:
  type: object
  required: [topic, strength]
  properties:
    topic:
      $ref: '#/TopicDto'
      description: The prerequisite topic itself (resolved, not just its id).
    strength:
      $ref: '#/PrerequisiteStrength'

CreateTopicRequest:
  type: object
  required: [code, titleRu, titleEn, learningLevel]
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 80
    titleRu:
      type: string
      minLength: 1
      maxLength: 200
    titleEn:
      type: string
      minLength: 1
      maxLength: 200
    learningLevel:
      $ref: '#/LearningLevel'
    isEvergreen:
      type: boolean
      default: false
    displayOrder:
      type: integer
      nullable: true

UpdateTopicRequest:
  type: object
  description: Full replace of mutable fields (PUT semantics), code is immutable after creation.
  required: [titleRu, titleEn, learningLevel]
  properties:
    titleRu:
      type: string
      minLength: 1
      maxLength: 200
    titleEn:
      type: string
      minLength: 1
      maxLength: 200
    learningLevel:
      $ref: '#/LearningLevel'
    isEvergreen:
      type: boolean
    displayOrder:
      type: integer
      nullable: true

AddPrerequisiteRequest:
  type: object
  required: [prerequisiteTopicId, strength]
  properties:
    prerequisiteTopicId:
      type: string
      format: uuid
    strength:
      $ref: '#/PrerequisiteStrength'

LevelSummary:
  type: object
  required: [level, topicCount]
  properties:
    level:
      $ref: '#/LearningLevel'
    topicCount:
      type: integer

GraphLayer:
  type: object
  required: [layer, topics]
  properties:
    layer:
      type: integer
      minimum: 0
      description: Computed layer index (0 = no prerequisites).
    topics:
      type: array
      items:
        $ref: '#/TopicDto'

TopicGraphResponse:
  type: object
  required: [layers, evergreen]
  properties:
    layers:
      type: array
      items:
        $ref: '#/GraphLayer'
      description: Layers ordered ascending, computed via Kahn's algorithm over topic_prerequisite edges.
    evergreen:
      type: array
      items:
        $ref: '#/TopicDto'
      description: Topics with isEvergreen=true, not part of the layered graph.

TopicTypeGroup:
  type: string
  enum: [vocabulary, declension, sandhi, conjugation, syntax, other]
  description: UI filter/icon group of a topic on the learning map page (mirrors frontend TypeGroup).

LearnTopicStatus:
  type: string
  enum: [mastered, in_progress, recommended, review, available]
  description: Per-user progress state of a topic. Currently generated randomly (real progress tracking is an open question).

LearnTopicDto:
  type: object
  required: [id, code, titleRu, titleEn, typeGroup, status, progressPercent, prerequisites]
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
      example: a-stem-masc
      description: Stable topic slug, used as the card id.
    titleRu:
      type: string
    titleEn:
      type: string
    typeGroup:
      $ref: '#/TopicTypeGroup'
    route:
      type: string
      nullable: true
      description: Frontend route for the "Study / Continue" button.
    status:
      $ref: '#/LearnTopicStatus'
    progressPercent:
      type: integer
      minimum: 0
      maximum: 100
    prerequisites:
      type: array
      items:
        type: string
      description: Prerequisite topic codes (UI hints only, never blocking).

LearnLayerDto:
  type: object
  required: [id, titleRu, titleEn, alwaysAvailable, topics]
  properties:
    id:
      type: string
      example: L0
      description: L0..L6 for learning levels, or "always" for the evergreen layer.
    titleRu:
      type: string
    titleEn:
      type: string
    alwaysAvailable:
      type: boolean
      description: True for the evergreen layer (Mixed review / Error correction).
    topics:
      type: array
      items:
        $ref: '#/LearnTopicDto'

LearnGraphResponse:
  type: object
  required: [layers]
  properties:
    layers:
      type: array
      items:
        $ref: '#/LearnLayerDto'
      description: L0..L6 layers plus a final alwaysAvailable evergreen layer.

ErrorResponse:
  type: object
  required: [status, message]
  properties:
    status:
      type: integer
    message:
      type: string
    details:
      type: string
      nullable: true
