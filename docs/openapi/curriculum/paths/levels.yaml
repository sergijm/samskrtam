    $ref: 'paths/levels.yaml#/paths/~1~1curriculum~1complex-quizzes~1{id}'
  /curriculum/learn-graph:
    $ref: 'paths/levels.yaml#/paths/~1~1curriculum~1learn-graph'
  /curriculum/graph:
    $ref: 'paths/levels.yaml#/paths/~1~1curriculum~1graph'
