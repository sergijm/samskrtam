# Пути из curriculum-service.yaml → topics.yaml
paths:
  /curriculum/topics:
    $ref: 'paths/topics.yaml#/paths/~1~1curriculum~1topics'
  /curriculum/topics/{id}:
    $ref: 'paths/topics.yaml#/paths/~1~1curriculum~1topics~1{id}'
  /curriculum/topics/{id}/prerequisites:
    $ref: 'paths/topics.yaml#/paths/~1~1curriculum~1topics~1{id}~1prerequisites'
  /curriculum/topics/{id}/prerequisites/{prerequisiteTopicId}:
    $ref: 'paths/topics.yaml#/paths/~1~1curriculum~1topics~1{id}~1prerequisites~1{prerequisiteTopicId}'
