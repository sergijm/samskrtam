# Schemas for curriculum-service API v2

PrerequisiteStrength:
  type: string
  enum: [RECOMMENDED, HELPFUL]
  description: Soft dependency strength — never blocks access to a topic, only drives UI hints.

LearningLevel:
  type: string
  enum: [L0, L1, L2, L3, L4, L5, L6]
  description: Authored first-introduction level. Independent from the prerequisite DAG — not derived, not a computed graph layer (see curriculum-service.md §2/§6).

ComplexQuizType:
  type: string
  enum: [MIXED_PRACTICE, LEVEL_ASSESSMENT]
  description: MIXED_PRACTICE composes 2-4 topics, LEVEL_ASSESSMENT composes 5-7 topics (validated server-side, not by the schema).

TopicDomain:
  type: string
  enum: [GRAMMAR, LEXICON]
  default: GRAMMAR
  description: >
    Discriminator added in V2 migration. LEXICON topics are backed by
    curriculum.lexical_topic_binding (see lexical-curriculum.md §1) instead of
    grammar Quest content. Graph/learningLevel/ComplexQuiz mechanics are shared
    across both domains unchanged.

TopicDto:
  type: object
  required: [id, code, titleRu, titleEn, learningLevel, domain, isEvergreen, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    code:
      type: string
      example: a-stem-masculine
      description: Stable slug, unique, used as an external reference by other services/frontend.
    titleRu:
      type: string
      example: "a-основа: masculine"
    titleEn:
      type: string
      example: "a-stem: masculine"
    learningLevel:
      $ref: '#/LearningLevel'
    domain:
      $ref: '#/TopicDomain'
    isEvergreen:
      type: boolean
      description: True for topics available always, outside the layered graph (Mixed review, Error correction).
    displayOrder:
      type: integer
      nullable: true
      description: Manual tie-break order within the same learningLevel.
    appearsInLevels:
      type: array
      nullable: true
      items:
        $ref: '#/LearningLevel'
      description: >
        Derived, read-only. Distinct learningLevel values of every ComplexQuiz that
        includes this topic, plus the topic's own learningLevel first. Only populated
        by GET /topics/{id}, omitted (null) in list responses for cost reasons.
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

TopicPrerequisiteDto:
  type: object
  required: [topic, strength]
  properties:
    topic:
      $ref: '#/TopicDto'
      description: The prerequisite topic itself (resolved, not just its id).
    strength:
      $ref: '#/PrerequisiteStrength'

CreateTopicRequest:
  type: object
  required: [code, titleRu, titleEn, learningLevel]
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 80
    titleRu:
      type: string
      minLength: 1
      maxLength: 200
    titleEn:
      type: string
      minLength: 1
      maxLength: 200
    learningLevel:
      $ref: '#/LearningLevel'
    domain:
      allOf: [$ref: '#/TopicDomain']
      default: GRAMMAR
    isEvergreen:
      type: boolean
      default: false
    displayOrder:
      type: integer
      nullable: true

UpdateTopicRequest:
  type: object
  description: Full replace of mutable fields (PUT semantics), code and domain are immutable after creation.
  required: [titleRu, titleEn, learningLevel]
  properties:
    titleRu:
      type: string
      minLength: 1
      maxLength: 200
    titleEn:
      type: string
      minLength: 1
      maxLength: 200
    learningLevel:
      $ref: '#/LearningLevel'
    isEvergreen:
      type: boolean
    displayOrder:
      type: integer
      nullable: true

AddPrerequisiteRequest:
  type: object
  required: [prerequisiteTopicId, strength]
  properties:
    prerequisiteTopicId:
      type: string
      format: uuid
    strength:
      $ref: '#/PrerequisiteStrength'

LevelSummary:
  type: object
  required: [level, topicCount]
  properties:
    level:
      $ref: '#/LearningLevel'
    topicCount:
      type: integer

ComplexQuizDto:
  type: object
  required: [id, type, learningLevel, titleRu, titleEn, topics, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    type:
      $ref: '#/ComplexQuizType'
    learningLevel:
      $ref: '#/LearningLevel'
    titleRu:
      type: string
    titleEn:
      type: string
    questionCountHint:
      type: integer
      nullable: true
      description: Decorative UI hint only (e.g. "15 questions"), not a real generated count.
    topics:
      type: array
      items:
        $ref: '#/TopicDto'
      description: Resolved topics composing this quiz (2-4 for MIXED_PRACTICE, 5-7 for LEVEL_ASSESSMENT).
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

ComplexQuizSummaryDto:
  type: object
  required: [id, type, learningLevel, titleRu, titleEn, topicCount]
  description: Lightweight variant for list endpoints — topics are not resolved, only counted.
  properties:
    id:
      type: string
      format: uuid
    type:
      $ref: '#/ComplexQuizType'
    learningLevel:
      $ref: '#/LearningLevel'
    titleRu:
      type: string
    titleEn:
      type: string
    questionCountHint:
      type: integer
      nullable: true
    topicCount:
      type: integer

UpsertComplexQuizRequest:
  type: object
  required: [type, learningLevel, titleRu, titleEn, topicIds]
  properties:
    type:
      $ref: '#/ComplexQuizType'
    learningLevel:
      $ref: '#/LearningLevel'
    titleRu:
      type: string
      minLength: 1
      maxLength: 200
    titleEn:
      type: string
      minLength: 1
      maxLength: 200
    questionCountHint:
      type: integer
      nullable: true
    topicIds:
      type: array
      minItems: 2
      maxItems: 7
      items:
        type: string
        format: uuid
      description: >
        Must contain 2-4 unique ids when type=MIXED_PRACTICE, or 5-7 unique ids
        when type=LEVEL_ASSESSMENT. Violation -> 422.

GraphLayer:
  type: object
  required: [layer, topics]
  properties:
    layer:
      type: integer
      minimum: 0
      description: Computed layer index (0 = no prerequisites).
    topics:
      type: array
      items:
        $ref: '#/TopicDto'

TopicGraphResponse:
  type: object
  required: [layers, evergreen]
  properties:
    layers:
      type: array
      items:
        $ref: '#/GraphLayer'
      description: Layers ordered ascending, computed via Kahn's algorithm over topic_prerequisite edges.
    evergreen:
      type: array
      items:
        $ref: '#/TopicDto'
      description: Topics with isEvergreen=true, not part of the layered graph.

ErrorResponse:
  type: object
  required: [status, message]
  properties:
    status:
      type: integer
    message:
      type: string
    details:
      type: string
      nullable: true
