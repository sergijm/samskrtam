openapi: 3.1.0

info:
  title: curriculum-service lexicon module — internal API
  description: |
    Contract consumed by quiz-service to generate lexical quiz sessions.
    Part of curriculum-service (module `lexicon`, schema `curriculum`), not a
    separate deployment — see docs/services/lexicon.md §0 and
    docs/services/lexical-quizzes.md §0/§5. Admin CRUD for taxonomies, sources,
    and vocabulary_quiz_definition is intentionally not detailed here (standard
    ADMIN-only REST CRUD, same conventions as topics — see curriculum-service.yaml);
    this file covers only the cross-service read/write contract.
  version: 2.0.0

servers:
  - url: http://localhost:8091/api/v2
    description: Local development (direct to curriculum-service)

paths:
  /lexicon/pool/resolve:
    get:
      summary: Resolve a candidate lexeme pool for session generation
      description: >
        Called by quiz-service at session start. Filters intersect across
        dimensions, union within a dimension (see lexical-quizzes.md §3).
        Balancing rules (per-topic quota, POS spacing) are applied here before
        the response is returned — quiz-service does not re-balance.
      operationId: resolveLexemePool
      parameters:
        - name: topicIds
          in: query
          schema:
            type: array
            items: { type: string, format: uuid }
        - name: frequencyRankMin
          in: query
          schema: { type: integer }
        - name: frequencyRankMax
          in: query
          schema: { type: integer }
        - name: posCodes
          in: query
          schema:
            type: array
            items: { type: string }
        - name: morphologyClassCodes
          in: query
          schema:
            type: array
            items: { type: string }
        - name: sourceId
          in: query
          schema: { type: string, format: uuid }
        - name: sourceLocationPrefix
          in: query
          schema: { type: string }
        - name: collectionId
          in: query
          schema: { type: string, format: uuid }
        - name: excludeMasteredForUserId
          in: query
          description: If set, excludes lexemes with masteryScore >= 90 for this user (except for adaptive review, where quiz-service omits this parameter).
          schema: { type: string, format: uuid }
        - name: poolLimit
          in: query
          description: Soft cap on returned candidates (typically sessionSize x 2-3, see lexical-quizzes.md §3).
          schema: { type: integer, default: 60 }
      responses:
        '200':
          description: Candidate pool
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LexemeCandidate'

  /lexicon/users/{userId}/progress:
    get:
      summary: Batch-fetch UserLexemeProgress for a set of candidate lexemes
      operationId: getUserLexemeProgressBatch
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lexemeIds
          in: query
          required: true
          schema:
            type: array
            items: { type: string, format: uuid }
      responses:
        '200':
          description: Progress rows (missing lexemeIds = never seen, treated as exposureCount=0 by the caller)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserLexemeProgressDto'

  /lexicon/users/{userId}/progress/{lexemeId}:
    patch:
      summary: Update UserLexemeProgress after an answer
      description: Called by quiz-service per answer or batched on session complete (implementation detail, not fixed by this contract).
      operationId: patchUserLexemeProgress
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: lexemeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correct]
              properties:
                correct:
                  type: boolean
      responses:
        '200':
          description: Updated progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLexemeProgressDto'

components:
  schemas:
    LexemeCandidate:
      type: object
      required: [lexemeId, lemmaIast, lemmaDevanagari, glossRu, glossEn, posCodes]
      properties:
        lexemeId: { type: string, format: uuid }
        lemmaIast: { type: string }
        lemmaDevanagari: { type: string }
        glossRu: { type: string }
        glossEn: { type: string }
        gender: { type: string, nullable: true }
        posCodes:
          type: array
          items: { type: string }
        morphologyClassCodes:
          type: array
          items: { type: string }
        frequencyRank:
          type: integer
          nullable: true
        wordForms:
          type: array
          description: Attested forms usable for VOCABULARY_CONTEXTUAL, if any exist for this lexeme.
          items:
            type: object
            properties:
              formIast: { type: string }
              formDevanagari: { type: string }
              contextSentence: { type: string, nullable: true }

    UserLexemeProgressDto:
      type: object
      required: [lexemeId, masteryScore, exposureCount, correctCount, incorrectCount]
      properties:
        lexemeId: { type: string, format: uuid }
        masteryScore: { type: integer }
        exposureCount: { type: integer }
        correctCount: { type: integer }
        incorrectCount: { type: integer }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        nextReviewAt: { type: string, format: date-time, nullable: true }

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

security:
  - bearerAuth: []
